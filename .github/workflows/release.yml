# Release: build and push the multi-arch mancube/eggrd image.
#
# THIS RUNS ON THE PUBLIC MIRROR (lucheeseng827/eggrd), not in the monorepo.
# GitHub Actions only runs workflows from `.github/workflows` at a repository root,
# so this file does nothing where it lives; it is shipped to the mirror by
# `.ossync.yaml` and runs there. That is deliberate: the mirror is public, and
# public repositories get free `ubuntu-24.04-arm` runners.
#
# ── Why a matrix of native runners, and not `platforms: linux/amd64,linux/arm64`
#
# One x86 runner building both architectures means QEMU emulating aarch64, and a
# `cargo build --release` under emulation is brutal: the 2026-07-14 release run on
# this repo took **1h26m**. Another Rust image build in the source repository already
# moved off QEMU for exactly this reason and records 5–10 min cold, 1–3 min warm.
#
# So each architecture builds on its own native runner, in parallel, and pushes by
# digest with no tag. A final job stitches the two digests into one manifest with
# `docker buildx imagetools create`. Wall-clock is the slower of the two builds
# rather than their sum, and nothing is emulated.
#
# ── Secrets
#
# `DOCKER_USERNAME` / `DOCKER_PASSWORD` on the `cicd` environment. A job must
# declare `environment: cicd` for `secrets.*` to resolve at all — omit it and the
# workflow runs green having pushed nothing, which is worse than failing.
name: release

on:
  # The monorepo's sync job ends with `gh release create vX --repo lucheeseng827/eggrd`,
  # so `release: published` is the trigger that actually fires in normal operation. The
  # tag-push trigger is kept as a safety net for a tag pushed directly on the mirror with no
  # release; a release created through the API does not always raise a push event, so the
  # push trigger alone is how a release silently ships no image. But `gh release create`
  # usually raises BOTH, so the `gate` job below stands the push-event run down whenever a
  # release exists for its tag: one pipeline per release.
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the image with (e.g. 0.2.3). Defaults to the git tag."
        required: false
      push:
        description: "Publish for real (Docker Hub + crates.io). false does a build-only dry run."
        type: boolean
        default: true

# ── What went wrong on 0.5.0, 0.7.0-rc.1 and 0.7.0, and what this file does about it
#
# The release runs were not at fault. Both runs (release event and tag push) queued on the
# concurrency group below, as intended, each wrote all three tags as one multi-arch index, and
# each passed its own assertion. About 22 minutes after the tag, after this workflow had
# finished, `X.Y.Z` (and on 0.7.0 `latest`) were overwritten by an amd64-only image with
# Docker media types and Docker-engine BuildKit history, built from this Dockerfile by some
# OTHER publisher holding the repository's credentials. `X.Y` was never touched. Nothing in
# this workflow pushes such an image, so nothing in this workflow could prevent it, and an
# assertion that runs only before the overwrite cannot see it.
#
# So, in order:
#   1. one pipeline per release (the `gate` job), so the only writes this workflow makes are
#      one set, from one run;
#   2. per-arch images are pushed by digest only, never with a tag;
#   3. `imagetools create` in `manifest` is the only step that writes `X.Y.Z`, `X.Y`, `latest`;
#   4. `manifest` asserts, for every tag it wrote, an index with linux/amd64 and linux/arm64,
#      the two digests this run built, and one digest across all tags (scripts/release-tags.sh);
#   5. `watch` re-asserts the tags for 45 minutes after the release. A tag found overwritten is
#      re-pointed to this run's index and the job FAILS, so the release is red until whoever
#      owns the other publisher turns it off.
#
# Earlier history: on 0.3.0 an assertion that grepped for `"architecture":"amd64"` (no space)
# could never match pretty-printed JSON and failed a correct release; it now parses the index.
#
# Keyed on the ref so a duplicate run queues behind the first instead of racing it (both
# events give `github.ref_name` = `vX`), and NOT cancel-in-progress: cancelling mid-push is
# what leaves half-written tags.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: mancube/eggrd

jobs:
  # One pipeline per release. `gh release create` raises a `release` event AND a tag `push`;
  # the push-event run stands down when a release exists for its tag, because the release-event
  # run publishes it. A tag pushed with no release (the case the push trigger is kept for) finds
  # none and goes ahead. The lookup is retried for a minute so a release created a moment after
  # its tag is still seen; if GitHub cannot be asked at all the run goes ahead, since a duplicate
  # run queues on the concurrency group and is harmless, and a missing one ships no image.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: One pipeline per release
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = "push" ]; then
            for i in 1 2 3 4 5; do
              if gh release view "$TAG" --repo "$REPO" --json tagName >/dev/null 2>&1; then
                run=false
                echo "::notice::release $TAG exists; its release-event run publishes it, so this tag-push run stands down."
                break
              fi
              if [ "$i" -lt 5 ]; then sleep 15; fi
            done
            if [ "$run" = true ]; then
              echo "No release for $TAG: a bare tag push, so this run publishes it."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.arch }}
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ${{ matrix.runner }}
    environment: cicd
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          # Free for public repositories. This is the line that brings arm64 back
          # without paying 80 minutes of emulation for it.
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    outputs:
      push: ${{ steps.cfg.outputs.push }}
      version: ${{ steps.cfg.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve version and whether to push
        id: cfg
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PUSH: ${{ inputs.push }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.platform }}
          HAS_CREDS: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$DISPATCH_VERSION" ]; then
            version="$DISPATCH_VERSION"
          elif [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#v}"        # release event
          else
            version="${REF_NAME#v}"           # tag push
          fi
          # A version is required: without one the tags below would be garbage.
          case "$version" in
            ""|v*) echo "::error::could not derive a version (event=$EVENT ref=$REF_NAME tag=$RELEASE_TAG)"; exit 1 ;;
          esac
          # A fork has no credentials; build anyway so the Dockerfile stays honest,
          # but never claim to have pushed.
          push=true
          [ "$EVENT" = "workflow_dispatch" ] && [ "$DISPATCH_PUSH" != "true" ] && push=false
          [ "$HAS_CREDS" != "true" ] && push=false
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "push=$push"       >> "$GITHUB_OUTPUT"
          echo "Building $version for $PLATFORM (push=$push)"

      - name: Assert Cargo.toml agrees with the release version
        env:
          VERSION: ${{ steps.cfg.outputs.version }}
        run: |
          set -euo pipefail
          # The image tag comes from the git tag, but the binary's --version comes from
          # Cargo.toml. Nothing else compares them, so a forgotten bump would publish
          # `eggrd:0.3.0` containing a binary that reports 0.2.2 — a mismatch nobody
          # notices until someone is debugging the wrong source.
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$crate" != "$VERSION" ]; then
            echo "::error::Cargo.toml is $crate but this release is $VERSION — bump Cargo.toml, or retag."
            exit 1
          fi
          echo "Cargo.toml $crate matches release $VERSION."

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to Docker Hub
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Push by digest only: no `tags:` here, ever. Tags are applied once, on the merged
      # manifest, so a half-finished release never leaves a tag pointing at a single
      # architecture. OCI media types, so the index `imagetools create` makes is an OCI index.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ steps.cfg.outputs.push == 'true' }}
          # Keep the manifest a plain multi-arch image: some runtimes choke on the
          # attestation manifest buildx adds by default.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,oci-mediatypes=true,push=${{ steps.cfg.outputs.push }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export the digest
        if: steps.cfg.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          test -n "$DIGEST" || { echo "::error::build produced no digest"; exit 1; }
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: steps.cfg.outputs.push == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── crates.io ─────────────────────────────────────────────────────────────────────────────
  # Independent of the image jobs: a Docker Hub outage should not block the crate, or vice
  # versa. This job existed on the mirror before the workflow was rewritten upstream and was
  # lost in that rewrite, which is why crates.io stopped at 0.2.1 while 0.2.2, 0.3.0 and 0.3.1
  # shipped as images. `cargo install eggrd` was handing people the version with broken ACME.
  crates:
    name: publish to crates.io
    # `push: false` is documented as a dry run, and a dry run must not publish a crate — a
    # crates.io release cannot be withdrawn, only yanked, so "oops" is permanent there in a way
    # it is not on Docker Hub. A real release event always publishes.
    needs: [gate]
    if: needs.gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.push)
    runs-on: ubuntu-24.04
    environment: cicd
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish edgeguard-ner, then eggrd
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATESIO_TOKEN }}
          # Derived here rather than from `needs.build`, deliberately: this job must not depend
          # on the image jobs, or a Docker Hub outage would also block the crate.
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CRATESIO_TOKEN is empty — add a crates.io API token as a cicd-environment secret."
            exit 1
          fi

          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$DISPATCH_VERSION" ]; then
            VERSION="$DISPATCH_VERSION"
          elif [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="${REF_NAME#v}"
          fi
          case "$VERSION" in
            ""|v*) echo "::error::could not derive a version (event=$EVENT ref=$REF_NAME tag=$RELEASE_TAG)"; exit 1 ;;
          esac

          # Same assertion the image job makes: the tag and the manifest must agree, or the
          # crate published under this version would not be the source this tag names.
          have=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$have" != "$VERSION" ]; then
            echo "::error::Cargo.toml is $have but this release is $VERSION."
            exit 1
          fi
          export CARGO_TARGET_DIR="$RUNNER_TEMP/eggrd-publish"

          # eggrd carries an optional `edgeguard-ner` dep with a registry version, so cargo
          # cannot publish eggrd until that version exists AND is indexed. Publish it first.
          #
          # GitHub Actions runs this step's script as `bash -e {0}` — `-e` is on by default,
          # independent of this file's own `set -uo pipefail` above, which does not cancel it.
          # Under `-e`, a bare `out=$(cmd); rc=$?` aborts the whole step the instant `cmd` fails,
          # before `rc=$?` (or any of the error-message/retry logic below) ever runs. `&& rc=0 ||
          # rc=$?` captures the real exit code without tripping `-e`.
          echo "== edgeguard-ner =="
          out=$(cargo publish --manifest-path edgeguard-ner/Cargo.toml 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            if echo "$out" | grep -qiE "already (exists|uploaded)|is already uploaded"; then
              echo "edgeguard-ner already published at this version — continuing."
            else
              echo "::error::edgeguard-ner publish failed."; exit "$rc"
            fi
          fi

          # Then eggrd, retrying only while the blocker is index propagation. Any other failure
          # exits immediately rather than burning four minutes to report the wrong cause.
          echo "== eggrd $VERSION =="
          for i in $(seq 1 12); do
            out=$(cargo publish 2>&1) && rc=0 || rc=$?
            echo "$out"
            if [ "$rc" -eq 0 ]; then
              echo "Published eggrd $VERSION to crates.io."; exit 0
            fi
            if echo "$out" | grep -qiE "already (exists|uploaded)|is already uploaded"; then
              echo "eggrd $VERSION already on crates.io — treating as success."; exit 0
            fi
            if echo "$out" | grep -qiE "no matching package named .?edgeguard-ner|failed to select a version for .?edgeguard-ner"; then
              echo "edgeguard-ner not indexed yet (attempt $i/12); waiting 20s…"; sleep 20; continue
            fi
            echo "::error::eggrd publish failed for a reason other than index propagation."; exit "$rc"
          done
          echo "::error::edgeguard-ner did not reach the index in time."; exit 1

  manifest:
    name: merge manifest
    needs: [build]
    if: needs.build.outputs.push == 'true'
    runs-on: ubuntu-24.04
    environment: cicd
    outputs:
      digest: ${{ steps.create.outputs.digest }}
      tags: ${{ steps.create.outputs.tags }}
      children: ${{ steps.create.outputs.children }}
    steps:
      # Only for scripts/release-tags.sh, the assertion this job and `watch` both run.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The ONLY step that writes `X.Y.Z`, `X.Y` and `latest`, all in one `imagetools create`
      # from the two per-arch digests above.
      - name: Create and push the multi-arch manifest
        id: create
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          files=(*)
          n=${#files[@]}
          # Two digests, or the manifest would silently ship one architecture.
          [ "$n" -eq 2 ] || { echo "::error::expected 2 digests, found $n"; exit 1; }
          # A prerelease (`0.6.0-beta.1`) gets its exact tag only. Moving `latest` or the `X.Y` tag to
          # it would hand a beta to everyone who pulls without pinning, and `${VERSION%.*}` of a
          # prerelease is not a minor version at all (`0.6.0-beta`).
          names=("$VERSION")
          case "$VERSION" in
            *-*) echo "Prerelease ${VERSION}: not moving latest or the minor tag." ;;
            *) names+=("${VERSION%.*}" latest) ;;
          esac
          tags=()
          for t in "${names[@]}"; do tags+=(-t "${IMAGE}:${t}"); done
          srcs=()
          children=()
          for d in *; do
            srcs+=("${IMAGE}@sha256:${d}")
            children+=("sha256:${d}")
          done
          docker buildx imagetools create "${tags[@]}" "${srcs[@]}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "Index ${digest} -> ${names[*]}"
          {
            echo "digest=${digest}"
            echo "tags=${names[*]}"
            echo "children=${children[*]}"
          } >> "$GITHUB_OUTPUT"

      # Hard gate, for EVERY tag written above: a multi-arch index with linux/amd64 and
      # linux/arm64, containing the two digests this run built, and one digest across all tags.
      # A wrong tag is re-pointed to the index once and re-asserted, and the step still fails.
      - name: Assert every tag is this run's multi-arch index
        env:
          TAGS: ${{ steps.create.outputs.tags }}
          EXPECT_DIGEST: ${{ steps.create.outputs.digest }}
          EXPECT_CHILDREN: ${{ steps.create.outputs.children }}
          HEAL: "1"
        run: |
          set -euo pipefail
          read -r -a tag_list <<<"$TAGS"
          bash scripts/release-tags.sh assert "$IMAGE" "${tag_list[@]}"

      - name: Summary
        env:
          TAGS: ${{ steps.create.outputs.tags }}
          DIGEST: ${{ steps.create.outputs.digest }}
        run: |
          # TAGS is a space-separated list, split on purpose; the backticks are Markdown.
          # shellcheck disable=SC2086,SC2016
          list=$(printf '`%s`, ' $TAGS)
          {
            echo "### Pushed \`${IMAGE}@${DIGEST}\`"
            echo
            echo "- \`linux/amd64\` built natively on \`ubuntu-24.04\`"
            echo "- \`linux/arm64\` built natively on \`ubuntu-24.04-arm\` (no QEMU)"
            echo "- tags: ${list%, }"
            echo "- the \`watch tags\` job keeps checking these tags for 45 minutes"
          } >> "$GITHUB_STEP_SUMMARY"

  # A tag that is right when `manifest` finishes can still be overwritten afterwards by any other
  # publisher with the repository's credentials. On 0.5.0, 0.7.0-rc.1 and 0.7.0 one did, about
  # 22 minutes after the tag, with an amd64-only image; every release run had already passed.
  # This job re-asserts the tags every two minutes for 45 minutes. A tag found overwritten is
  # re-pointed to this run's index and the job fails: the tags are right again, and the release
  # is red until the other publisher is switched off.
  watch:
    name: watch tags
    needs: [manifest]
    runs-on: ubuntu-24.04
    environment: cicd
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Re-assert the tags for 45 minutes
        env:
          TAGS: ${{ needs.manifest.outputs.tags }}
          EXPECT_DIGEST: ${{ needs.manifest.outputs.digest }}
          EXPECT_CHILDREN: ${{ needs.manifest.outputs.children }}
          HEAL: "1"
        run: |
          set -euo pipefail
          read -r -a tag_list <<<"$TAGS"
          bash scripts/release-tags.sh watch "$IMAGE" 45 120 "${tag_list[@]}"
