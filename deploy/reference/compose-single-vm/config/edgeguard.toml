# eggrd 0.7 — one VM, Docker Compose, eggrd terminating TLS in front of one app.
#
# This file is the LOCAL variant: a self-signed certificate for app.example.test, so the whole
# setup runs on a laptop. For a real host use ../config-acme/edgeguard.toml, which differs only in
# [tls] / [tls.acme] and the host name. Both pass `edgeguard doctor` with 0 errors on 0.7.0.
#
# This directory is bind-mounted whole (./config:/etc/edgeguard:ro). That is what makes hot
# reload work: eggrd watches the config's DIRECTORY for an event on a file of this name, and a
# single-file bind mount never delivers one (edit it and nothing happens until a restart).

[server]
port = 443
upstream = "http://app:8000"
# Ops listener (health, ready, metrics, upstreams, tls). It has no auth. 0.0.0.0 here is inside
# the container: compose publishes it on the HOST's 127.0.0.1 only, so it never leaves the VM.
admin_port = 9090
admin_addr = "0.0.0.0"
# Nothing sits in front of this edge, so the TCP peer is the client. Never trust X-Forwarded-For
# on a directly exposed edge: every client would choose its own address.
trust_forwarded_for = false
# Connection hardening (0.7): a slow or silent client is closed after 30 s; at most 1024
# connections are held open; on SIGTERM keep accepting 2 s (ready already 503), then finish
# in-flight requests for up to 10 s. compose's stop_grace_period (20s) covers both.
header_read_timeout = "30s"
max_connections = 1024
drain_delay = "2s"
drain_timeout = "10s"

[tls]
enabled = true
cert_path = "/var/lib/edgeguard/cert.pem"
key_path = "/var/lib/edgeguard/key.pem"
# LOCAL ONLY: generate a certificate on first start. It encrypts but proves no identity.
self_signed = true
self_signed_hosts = ["app.example.test", "localhost", "127.0.0.1"]
# :80 answers 308 to https://, for the names below only (a forged Host gets no redirect).
redirect_port = 80
redirect_status = 308
redirect_hosts = ["app.example.test"]

[headers]
hsts = true
# Roll a CSP out as report-only first (csp_report_only = true, csp_report_uri =
# "/__edgeguard/csp-report"), read the reports in the access log for a week, then enforce.
csp = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
csp_report_only = false
referrer_policy = "no-referrer"
permissions_policy = "geolocation=(), microphone=(), camera=()"
frame_options = "DENY"
force_secure_cookies = true
strip = ["Server", "X-Powered-By"]

[waf]
# Shipped in block mode because this is the end state. On a live app, roll it out as
# report -> review -> block: start with mode = "report", read the "WAF rule matched
# (report-only)" lines for a day or a week, fix or exempt what is legitimate, then block.
mode = "block"
sqli = true
xss = true
path_traversal = true
inspect_path = true
inspect_headers = true     # needed by the Host rule below
inspect_body = false       # turn on only after a report-mode run over real traffic

# Refuse every Host but app.example.test (or app.example.test:443). Generated by
# deploy/reference/tools/host-rule.sh. Needs [waf] mode = "block" and inspect_headers = true.
# Replace with allowed_hosts on 0.8.
[[waf.rules]]
id      = "host-allowlist"
target  = "headers"
pattern = '(?mi)^host:[ \t]*(?:|a|ap|app|app\.|app\.e|app\.ex|app\.exa|app\.exam|app\.examp|app\.exampl|app\.example|app\.example\.|app\.example\.t|app\.example\.te|app\.example\.tes|[^a \t\n].*|a[^p\n].*|ap[^p\n].*|app[^.\n].*|app\.[^e\n].*|app\.e[^x\n].*|app\.ex[^a\n].*|app\.exa[^m\n].*|app\.exam[^p\n].*|app\.examp[^l\n].*|app\.exampl[^e\n].*|app\.example[^.\n].*|app\.example\.[^t\n].*|app\.example\.t[^e\n].*|app\.example\.te[^s\n].*|app\.example\.tes[^t\n].*|app\.example\.test[^:\n].*|app\.example\.test:|app\.example\.test:4|app\.example\.test:44|app\.example\.test:[^4\n].*|app\.example\.test:4[^4\n].*|app\.example\.test:44[^3\n].*|app\.example\.test:443.+)[ \t]*$'

[ratelimit]
enabled = true
rate = "120/min"
burst = 30
store = "local"            # one edge: local is exact. Several edges need store = "redis".

# A tighter limit where guessing pays: the login form.
[[ratelimit.routes]]
path = "/login"
rate = "5/min"
burst = 3
name = "login"

[validation]
max_body = "5MiB"
upstream_timeout = "30s"
upstream_connect_timeout = "5s"     # the 0.7 default, written out
# The standard methods only: PROPFIND, TRACE, CONNECT and friends get 405 at the edge.
allow_methods = ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]

[log]
query = "redact"
principal = "hash"
