# Local stand-in for an AWS ALB, for smoke.sh. Not an ALB: nginx doing what the ALB does to the
# request that matters here. It appends the peer to X-Forwarded-For ($proxy_add_x_forwarded_for,
# the ALB's `append` mode), re-encrypts to eggrd, and in the mTLS servers forwards the client's
# certificate in a header.
events {}
http {
  access_log off;
  proxy_ssl_server_name on;
  proxy_ssl_name app.example.test;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # ALB in append mode -> eggrd with forwarded_hops = 1
  server { listen 8001; location / { proxy_pass https://e1:443; } }

  # The ALB behind CloudFront -> eggrd with forwarded_hops = 2 (cf.conf is CloudFront)
  server { listen 8002; location / { proxy_pass https://e2:443; } }

  # ALB mTLS passthrough: ask for a certificate, verify nothing, forward it URL-encoded
  server {
    listen 8443 ssl;
    ssl_certificate /pki/server.pem;
    ssl_certificate_key /pki/server.key;
    ssl_verify_client optional_no_ca;
    location / {
      proxy_set_header X-Amzn-Mtls-Clientcert $ssl_client_escaped_cert;
      proxy_pass https://e4:443;
    }
  }

  # A balancer trusted by its certificate (trusted_proxy_names): it verifies the client, then
  # presents its OWN certificate (lb.pem, from the balancer-only CA) to eggrd.
  server {
    listen 8444 ssl;
    ssl_certificate /pki/server.pem;
    ssl_certificate_key /pki/server.key;
    ssl_verify_client on;
    ssl_client_certificate /pki/ca.pem;
    location / {
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_ssl_certificate /pki/lb.pem;
      proxy_ssl_certificate_key /pki/lb.key;
      proxy_pass https://e5:443;
    }
  }
}
