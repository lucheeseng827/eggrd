# eggrd 0.7.0: a hardened baseline for an edge that terminates TLS itself (one VM, Docker or
# systemd), in front of one app. Every key here is checked against src/config.rs at 0.7.0 and the
# file passes `edgeguard doctor` with 0 errors. The comments name the checklist items
# (../HARDENING-CHECKLIST.md) each setting implements.
#
# Replace app.example.com, the upstream and the ACME contact. Regenerate the Host rule for your
# name with deploy/reference/tools/host-rule.sh <host>. Behind a load balancer, start from
# deploy/reference/aws-nlb or aws-alb instead: the client-address settings differ.

[server]
port = 443
upstream = "http://app:8000"
# EG-HARD-002: the ops endpoints (health, ready, metrics, tls, upstreams) on their own listener,
# unauthenticated, so on loopback. In a container, loopback is the container's own: set
# admin_addr = "0.0.0.0" AND publish only on the host's loopback (-p 127.0.0.1:9090:9090).
admin_port = 9090
admin_addr = "127.0.0.1"
# EG-HARD-040: eggrd is the edge here, so the TCP peer is the client. Never true without a proxy.
trust_forwarded_for = false
# EG-HARD-063 / 064: slow and excess connections.
header_read_timeout = "30s"
max_connections = 1024
drain_delay = "2s"
drain_timeout = "10s"

[tls]
enabled = true
cert_path = "/var/lib/edgeguard/cert.pem"
key_path = "/var/lib/edgeguard/key.pem"
# EG-HARD-021: catch plaintext visitors, and only for the names you serve.
redirect_port = 80
redirect_status = 308
redirect_hosts = ["app.example.com"]

[tls.acme]
# EG-HARD-020 / 022: a publicly trusted certificate, renewed in process. The default directory is
# Let's Encrypt STAGING: production must be named.
enabled = true
domains = ["app.example.com"]
email = "security@example.com"        # EG-HARD-182: a role address
directory_url = "https://acme-v02.api.letsencrypt.org/directory"
cache_dir = "/var/lib/edgeguard/acme"  # EG-HARD-180: chmod 600 its files until 0.8
accept_tos = true
renew = true
ari = true

[auth]
# EG-HARD-100: "none" only because this app authenticates every route itself. Otherwise pick a gate.
mode = "none"

[ratelimit]
# EG-HARD-120 / 121.
enabled = true
rate = "120/min"
burst = 30
store = "local"

[[ratelimit.routes]]
path = "/login"
rate = "5/min"
burst = 3
name = "login"

[[ratelimit.routes]]
path = "/api/password-reset"
rate = "3/min"
burst = 2
name = "password-reset"

[validation]
# EG-HARD-060 / 061 / 062 / 162 / 164.
allow_methods = ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
max_body = "5MiB"
max_header_bytes = "32KiB"
max_response_body = "64MiB"
upstream_timeout = "30s"
upstream_connect_timeout = "5s"

[headers]
# EG-HARD-140 to 145. The CSP ships in report-only (EG-HARD-140 phase 1): this strict policy blocks
# inline scripts, which many frameworks need to hydrate. Watch edgeguard_csp_reports_total under
# real use, adjust the policy, then set csp_report_only = false.
hsts = true
csp = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
csp_report_only = true
csp_report_uri = "/__edgeguard/csp-report"
referrer_policy = "no-referrer"
permissions_policy = "geolocation=(), microphone=(), camera=()"
frame_options = "DENY"
force_secure_cookies = true
httponly_cookies = true
strip = ["Server", "X-Powered-By"]

[waf]
# EG-HARD-080 / 081: block, after a report-mode run over real traffic. Body inspection only once
# that run showed no legitimate body matching.
mode = "block"
sqli = true
xss = true
path_traversal = true
inspect_path = true
inspect_headers = true
inspect_body = false

# EG-HARD-083: paths no app of yours serves, refused at the edge (403) instead of reaching the
# app's catch-all route. Case-insensitive, matched on the path and query, raw and percent-decoded.
# The dotfiles are refused at any depth (/app/.env, /blog/.git/config); the rest is anchored at the
# root, tolerating repeated slashes and ./ segments (//wp-login.php, /./phpinfo).
[[waf.rules]]
id      = "never-valid-paths"
target  = "path"
pattern = '(?i)(^|/)(\.env|\.git/|\.aws/|\.svn/|\.ds_store)|^/+(\./+)*(wp-admin|wp-login\.php|xmlrpc\.php|phpinfo|vendor/phpunit|cgi-bin/|server-status)'

# EG-HARD-082: refuse every Host but the one served (raw-IP requests, forged names). Generated by
# deploy/reference/tools/host-rule.sh app.example.com; replace with allowed_hosts on 0.8.
[[waf.rules]]
id      = "host-allowlist"
target  = "headers"
pattern = '(?mi)^host:[ \t]*(?:|a|ap|app|app\.|app\.e|app\.ex|app\.exa|app\.exam|app\.examp|app\.exampl|app\.example|app\.example\.|app\.example\.c|app\.example\.co|[^a \t\n].*|a[^p\n].*|ap[^p\n].*|app[^.\n].*|app\.[^e\n].*|app\.e[^x\n].*|app\.ex[^a\n].*|app\.exa[^m\n].*|app\.exam[^p\n].*|app\.examp[^l\n].*|app\.exampl[^e\n].*|app\.example[^.\n].*|app\.example\.[^c\n].*|app\.example\.c[^o\n].*|app\.example\.co[^m\n].*|app\.example\.com[^:\n].*|app\.example\.com:|app\.example\.com:4|app\.example\.com:44|app\.example\.com:[^4\n].*|app\.example\.com:4[^4\n].*|app\.example\.com:44[^3\n].*|app\.example\.com:443.+)[ \t]*$'

[log]
# EG-HARD-246: credentials in query strings are redacted (the default), principals hashed.
query = "redact"
principal = "hash"
