[package]
name = "edgeguard-worker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "EdgeGuard's response-hardening + edge-auth subset as a Rust->WASM Cloudflare Worker."
publish = false

# Detached from the parent workspace on purpose: this crate targets
# wasm32-unknown-unknown and pulls in the Cloudflare `worker` runtime, neither of which the
# native workspace build (or this crate's CI) should try to compile. An empty [workspace] table
# makes this crate its own workspace root, so the outer workspace ignores it. Build it with
# `worker-build` / `wrangler` — see README.md.
[workspace]

[lib]
# cdylib for the wasm artifact; rlib so the pure logic can be unit-tested on the host target.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Basic-auth credential decoding. Pure Rust; compiles for both the native host (tests) and wasm.
base64 = "0.22"

# The Cloudflare Workers runtime bindings (and the bytes->JsValue glue for forwarding a body).
# wasm-only: target-gating keeps native `cargo test` — which exercises the pure hardening/auth
# logic below — from needing the wasm-only runtime.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8"
js-sys = "0.3"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
# NO `strip = true`.
#
# Stripping this crate broke the build outright — not the size, the build. `worker-build`
# invokes wasm-bindgen with `--force-enable-abort-handler`, which generates catch wrappers, and
# those need the externref table. Stripping removes the symbols wasm-bindgen uses to find it, so
# it failed with:
#
#     error: failed to generate catch wrappers
#     caused by: externref table required for catch wrappers
#
# which names neither `strip` nor this file, and reads like a toolchain incompatibility. It was
# bisected by holding everything else constant: lto=true + strip=none builds, lto=false +
# strip=true fails. LTO was never the problem.
#
# wasm-bindgen and wasm-opt strip what is safe to strip during their own passes, so the emitted
# artifact is not meaningfully larger for having left this off.
