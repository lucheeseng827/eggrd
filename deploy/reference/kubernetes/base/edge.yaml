# The edge: eggrd 0.7.0, two replicas, `restricted`-compliant: non-root, read-only root, every
# capability dropped but NET_BIND_SERVICE. It listens on 443 and 80 inside the pod because the
# redirect listener writes server.port into its Location: an edge on 8443 behind a Service on 443
# would send plaintext visitors to https://host:8443/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eggrd
  namespace: eggrd-edge
  labels: { app: eggrd }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: eggrd }
  template:
    metadata:
      labels: { app: eggrd }
    spec:
      automountServiceAccountToken: false
      # drain_delay (10s) + drain_timeout (15s) + a margin. The kubelet sends SIGTERM, eggrd turns
      # /ready 503 at once and keeps accepting for drain_delay while endpoints and load balancers
      # catch up, then finishes in-flight requests. Behind an NLB raise drain_delay to 25s and this
      # to 60 (see ../aws-nlb).
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
        # Lets a non-root process bind 443/80 whatever the runtime does with capabilities (a
        # "safe" sysctl, allowed by `restricted`). NET_BIND_SERVICE below covers the rest.
        sysctls:
          - { name: net.ipv4.ip_unprivileged_port_start, value: "0" }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: eggrd } }
      containers:
        - name: eggrd
          # Pinned by digest: the multi-arch 0.7.0 index.
          image: docker.io/mancube/eggrd:0.7.0@sha256:b19278b379a457e626954e148effffa2fe559613d55ff497fdaa862c8c4096f6
          args: ["--config", "/etc/eggrd/edgeguard.toml"]
          env:
            - { name: RUST_LOG, value: info }
          ports:
            - { name: https, containerPort: 443 }
            - { name: http, containerPort: 80 }
            - { name: admin, containerPort: 9090 }
          # Probes on the admin port: the public port answers 404 for /__edgeguard/* and is behind
          # the Host rule. /ready is 503 while the upstream is down and during a drain; /health
          # only says the process answers.
          readinessProbe:
            httpGet: { path: /__edgeguard/ready, port: admin }
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: { path: /__edgeguard/health, port: admin }
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /__edgeguard/health, port: admin }
            periodSeconds: 1
            failureThreshold: 30
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] }
          volumeMounts:
            - { name: config, mountPath: /etc/eggrd, readOnly: true }
            - { name: tls, mountPath: /etc/eggrd-tls, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # Generated by kustomize with a content hash in its name (eggrd-config-<hash>): any edit
        # makes a new ConfigMap, the Deployment's reference changes, and the pods roll. That is
        # the roll-on-change pattern. A ConfigMap edited in place reaches the pods' files at the
        # kubelet's next sync (it swaps a `..data` symlink); eggrd 0.7.0 reloaded on that swap on
        # k3s v1.31.14, not in one run on k3s v1.33.4 with the Docker runtime, untested elsewhere:
        # do not rely on it.
        - name: config
          configMap: { name: eggrd-config }
        # A kubernetes.io/tls Secret: cert-manager's Certificate in production, or
        # `kubectl create secret tls eggrd-tls ...`. eggrd re-reads a renewed pair on its own.
        - name: tls
          secret: { secretName: eggrd-tls }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
---
# A ClusterIP Service: in-cluster callers, and what an Ingress or a cloud LB controller targets.
# The loadbalancer overlay turns it into a LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: eggrd
  namespace: eggrd-edge
  labels: { app: eggrd }
spec:
  type: ClusterIP
  selector: { app: eggrd }
  ports:
    - { name: https, port: 443, targetPort: https }
    - { name: http, port: 80, targetPort: http }
---
# The admin port gets its own Service, for Prometheus only (the NetworkPolicy admits the
# monitoring namespace). It has no auth: never expose it through an Ingress or a LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: eggrd-admin
  namespace: eggrd-edge
  labels: { app: eggrd, eggrd.example.com/scrape: "true" }
spec:
  type: ClusterIP
  selector: { app: eggrd }
  ports:
    - { name: admin, port: 9090, targetPort: admin }
---
# One replica may be down for a node drain or a roll; never both.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eggrd
  namespace: eggrd-edge
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: eggrd }
