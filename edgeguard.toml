# EdgeGuard configuration (TOML).
#
# Everything here is OPTIONAL — EdgeGuard runs with secure defaults and reads
# PORT / APP_PORT / UPSTREAM from the environment. This file layers richer policy
# on top. Env vars (PORT, APP_PORT, UPSTREAM) override the [server] values below.

[server]
# Public port EdgeGuard listens on. Usually injected by the platform as $PORT.
port = 8080
# Internal port your app listens on (EdgeGuard sets PORT=<app_port> for the child).
app_port = 3000
# Or point at an external upstream instead of a wrapped child (separate-service mode):
# upstream = "http://app.internal:3000"
# EdgeGuard fails closed: an unreachable upstream returns 502 (it never serves forged or
# stale content). A configurable fail-open mode returns alongside the distributed limiter
# (see docs/ROADMAP.md, Phase 4), where it actually has a backing store that can fail.
# Trust X-Forwarded-For for the client IP. Enable ONLY behind a trusted proxy/LB
# (e.g. a PaaS edge); otherwise a directly reachable client can spoof its IP and
# defeat per-IP rate limiting. Default false => use the real peer address.
# This also governs X-Forwarded-Proto sent upstream: if EdgeGuard terminates TLS ([tls]
# below) it forwards "https"; otherwise, when this is true the edge's incoming
# X-Forwarded-Proto is preserved, and when false a plain-HTTP hop forwards "http".
trust_forwarded_for = false
# Public/private split (optional). When admin_port is non-zero, EdgeGuard serves the internal
# ops endpoints (/__edgeguard/health, /ready, /metrics) on a SECOND, plain-HTTP listener at
# admin_addr:admin_port instead of the public port — so metrics/health aren't exposed publicly.
# The public port then serves only the proxy + the browser-facing CSP sink. Point your platform
# health check at admin_port when enabled, and keep it on a trusted network (it has no auth).
admin_port = 0            # 0 = keep internal endpoints on the public port (default)
admin_addr = "127.0.0.1"  # loopback (same-host scraper); "0.0.0.0" for a private interface
# Connection hygiene, on every listener. A connection must send a complete request head within
# header_read_timeout — a new one that sends nothing, a slow one, or a keep-alive connection idle
# between requests — or it is closed. "0" disables it (don't, on a public port).
header_read_timeout = "30s"
max_connections = 0       # open connections on the public listener; 0 = unlimited
# Graceful shutdown. On SIGTERM, /__edgeguard/ready turns 503 at once; the listener keeps accepting
# for drain_delay (give your load balancer time to stop routing here), then finishes in-flight
# requests for up to drain_timeout before exiting. A --wrap'ped app is stopped after the drain.
# Keep drain_delay + drain_timeout under your platform's kill deadline (Kubernetes: 30s default).
drain_delay = "0s"
drain_timeout = "25s"
# Behind an L4 load balancer that passes TCP through (AWS NLB with IP targets, HAProxy mode tcp,
# nginx stream, a GCP TCP proxy), every connection comes from the balancer, and X-Forwarded-For
# cannot help: nothing writes it. Have the balancer send a PROXY protocol header (v1 or v2) and
# read it here: the client it names is what rate limits, [access] and the logs see. It is believed
# only from proxy_protocol_trusted (required; a /0 is refused); from anyone else a connection
# that starts with one is closed, and one without is served as it is. Public and redirect listeners
# only, read before the TLS handshake. Leave trust_forwarded_for off with it.
proxy_protocol = false
proxy_protocol_trusted = []   # the balancer's subnets, e.g. ["10.0.0.0/20"]

# --- Per-path upstream overrides (optional; single upstream by default) ---
# Everything goes to server.upstream/app_port unless a prefix below matches. The common use is a
# static frontend + an /api backend. Longest matching prefix wins; no match falls back to the
# default upstream. This is a STATIC PREFIX MAP, not a gateway — no service discovery, load
# balancing, or request rewriting (the path is forwarded unchanged).
# [[upstreams]]
# path = "/api/"
# target = "http://api.internal:4000"
# [[upstreams]]
# path = "/auth/"
# target = "http://auth.internal:5000"
#
# Balancing and failover: `targets` instead of `target` makes a pool. balance = "priority" sends each
# request to the first target in rotation; "round_robin" takes them in turn. `backup` targets take
# requests only when none of `targets` will. A request that cannot connect is sent to the next
# target, and its target is ejected for eject_for. A health check takes targets out (and back)
# before requests find them gone. path = "/" puts the whole app behind the pool.
# [[upstreams]]
# path = "/"
# name = "app"
# targets = [{ url = "http://10.0.1.5:8080", weight = 2 }, "http://10.0.1.6:8080"]
# balance = "round_robin"  # default "priority"; or "least_conn": fewest requests in flight per weight;
#                          # or "hash": the same hash_on key to the same target
# hash_on = "header:x-tenant"  # with "hash": "client_ip" (default), "path", "header:<name>",
#                              # "cookie:<name>", "query:<name>"
# sticky_cookie = "eg_upstream"  # keep each client on the target that answered it; empty = off
# sticky_cookie_max_age = "8h"   # its Max-Age, from when it is set; empty = a session cookie
# sticky_cookie_strip = true     # keep it from the upstream (the client's other cookies go)
# backup = ["https://standby.example.com"]
# eject_after = 1          # failed connections in a row that take a target out; 0 = off
# eject_for = "30s"        # × ejections in a row, up to eject_for_max
# eject_for_max = "5m"     # and back to eject_for after this long without another ejection
# eject_after_5xx = 5      # 5xx answers in a row that take a target out (never the last); 0 = off
# [upstreams.health_check]
# path = "/healthz"        # 2xx/3xx passes; empty = no active checks
# interval = "5s"
# timeout = "2s"
# unhealthy_after = 2
# healthy_after = 2
# expect_status = "200-399"  # codes, ranges, classes: "200,204", "2xx"
# expect_body = '"status":"ok"'  # and this text within the body's first 64 KiB; empty = status only
# expect_body_regex = '"status":\s*"(ok|degraded)"'  # or a regex over the body (not both)
# method = "GET"           # or "HEAD" (status only), "OPTIONS", ...
# headers = [["Host", "app.internal"]]  # sent with each check; values are never shown
# port = 8081              # check each target's management port instead; 0 = its own
# type = "http"            # or "tcp": only connect to each target (no path, no expect_*, method, headers)

# --- TLS to https:// upstreams (optional; works with no settings) ---
# An https:// upstream (server.upstream or a [[upstreams]] target) is verified against the public
# web PKI by default, built into the binary. Set ca_path to trust only a private CA instead, and
# cert_path/key_path to present a client certificate (mutual TLS). There is no "skip
# verification": put a self-signed upstream certificate in ca_path. Read at startup; the client
# certificate is reloaded when its files change.
# [upstream_tls]
# ca_path = "/etc/eggrd/upstream-ca.pem"
# cert_path = "/etc/eggrd/edge-client.pem"
# key_path = "/etc/eggrd/edge-client.key"
# server_name = ""        # name to verify instead of the URL's host (for an upstream dialled by IP)
# One upstream with its own settings; empty keys inherit the ones above.
# [[upstream_tls.targets]]
# target = "https://10.0.3.7:8443"
# server_name = "api.internal"

[auth]
# Gate applied to every proxied request (the internal /__edgeguard/* endpoints are exempt):
#   "none"   — no authentication
#   "basic"  — HTTP Basic against [auth].users
#   "apikey" — a static API key / bearer token from [auth].api_keys
#   "jwt"    — a verified JWT bearer token per [auth.jwt]
#   "mtls"   — the client certificate verified by [tls.client_auth], per [auth.mtls]
mode = "basic"
realm = "EdgeGuard"
# username -> password. A value starting with "$argon2" is verified as a PHC hash; anything
# else is treated as a LITERAL plaintext password (dev only). The placeholder below is an
# intentionally invalid "$argon2" string, so the shipped config can NEVER authenticate anyone
# — REPLACE it before exposing anything. Generate a real hash with the built-in helper:
#   echo -n 'your-password' | edgeguard --hash
# (or any argon2 PHC tool, e.g. `echo -n 'pw' | argon2 "$(openssl rand -base64 16)" -id -e`)
users = { admin = "$argon2id$REPLACE_ME$run-edgeguard---hash-to-generate-a-real-value" }

# --- API-key gate (mode = "apikey") ---
# Keys are compared in constant time and may be presented as `Authorization: Bearer <key>`
# or in the `api_key_header`. Prefer the EDGEGUARD_API_KEYS env var (comma-separated) over
# committing keys to this file.
# api_keys = ["sk_live_xxx", "sk_live_yyy"]
# api_key_header = "X-API-Key"

# --- JWT gate (mode = "jwt") ---
[auth.jwt]
# Expected algorithm; the token's own `alg` must match (no alg-substitution/`alg=none`).
algorithm = "HS256"   # HS256/384/512, RS256/384/512, PS*, ES256/384, EdDSA
# HS*: shared secret. Prefer EDGEGUARD_JWT_SECRET over this file.
secret = ""
# RS*/ES*/PS*: a static PEM public key, OR a JWKS endpoint (keys cached + selected by `kid`).
public_key_pem = ""
jwks_url = ""
jwks_cache_secs = 300
# Optional claim checks (empty = not enforced) and clock-skew leeway.
issuer = ""
audience = ""
leeway_secs = 60

# --- Client-certificate gate (mode = "mtls"; needs [tls.client_auth]) ---
# Which of the certificates the client CA issues may call the app: exact names, or prefixes ending
# in `*`. The principal is the certificate's first allowed name (URI, then DNS, email, CN).
# [auth.mtls]
# allowed = ["spiffe://prod.example/ns/web/*"]

[ratelimit]
enabled = true
rate = "60/min"   # default per-client-IP limit; supports N/sec, N/min, N/hour
burst = 20
# Where limiter state lives. "local" (default) is the fast in-process governor limiter, but it
# counts PER REPLICA — N instances behind a load balancer allow N× the limit. For multi-replica
# deployments use "redis" to share one global GCRA limit across instances. "memory" uses the
# same shared-store code path with an in-process map (single-replica / testing). Same rate/burst
# /routes/per_key settings apply regardless of store.
store = "local"   # "local" | "redis" | "memory"
# Redis connection for store = "redis" (redis:// or, for TLS, rediss://). Prefer the
# EDGEGUARD_REDIS_URL env var over committing it here.
redis_url = "redis://127.0.0.1:6379"
redis_prefix = "edgeguard"   # key namespace, so multiple deployments can share one Redis
# On a store error: false (default) fails CLOSED (503, so an outage can't silently disable rate
# limiting); true fails OPEN (allow the request — availability over strict limiting).
fail_open = false
# Per-route overrides (longest matching path prefix wins; still keyed per client IP).
# A matching route's limit REPLACES the global one for that path.
# [[ratelimit.routes]]
# path = "/api/"
# rate = "10/sec"
# burst = 20
# name = "api"         # the route label in edgeguard_route_* metrics (default: the path)
# [[ratelimit.routes]]
# path = "/api/admin/"
# rate = "1/sec"
# burst = 5

# Extra limit keyed by the authenticated principal (API-key id / JWT `sub`) rather than IP,
# so one credential can't fan out across many IPs. Only applies to authenticated requests.
[ratelimit.per_key]
enabled = false
rate = "1000/hour"
burst = 100

[validation]
max_body = "2MiB"
# Cap on the upstream response body EdgeGuard buffers ("0" = unbounded). Set a limit
# (e.g. "16MiB") to stop a huge upstream response from OOM-ing the proxy; raise it if
# you proxy large downloads.
max_response_body = "0"
# Max time to wait for the upstream response and to read its body, e.g. "30s", "500ms",
# "2m". "0" disables it. A stalled upstream returns 504 instead of pinning the request.
upstream_timeout = "30s"
# Max time to open the connection to an upstream; past it the request fails with 502, or moves to
# a pool's next target. An upstream whose packets are dropped never refuses, so without this it
# holds the request for all of upstream_timeout. "0" leaves it to upstream_timeout. Read at startup.
upstream_connect_timeout = "5s"
# Cap on total request header bytes (sum of name + value), e.g. "32KiB". "0" disables it.
# Requests over the limit get 431. A policy limit on top of hyper's transport-level cap.
max_header_bytes = "0"
# Empty list = allow all methods.
allow_methods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS", "HEAD"]
# Forward `text/event-stream` (SSE) responses unbuffered, frame-by-frame as they arrive,
# instead of buffering the whole body first. Off by default (the proxy buffers so it can apply
# `max_response_body` and count exact bytes). Turn on for Server-Sent Events / streaming
# backends so clients see events immediately (time-to-first-byte is preserved). When a response
# streams this way, `max_response_body` and the body-read timeout don't apply (the
# connect/first-byte `upstream_timeout` still does). Non-SSE responses are unaffected.
stream_passthrough = false
# Stream responses of ANY content type (downloads, large JSON) as they arrive, instead of holding
# the whole body in memory. Only when nothing needs the whole body: LLM routes, reversible DLP and
# outbound DLP scanning still buffer. `max_response_body` still applies, enforced as bytes flow
# (over it the connection is cut — the headers are already out); the body-read timeout does not.
stream_responses = false
# Stream REQUEST bodies (uploads) to the upstream as they arrive. Only when nothing reads the whole
# body first: a WAF rule on the body, inbound DLP and LLM features still buffer. `max_body` still
# applies: a declared Content-Length over it is refused up front; a body that grows past it is cut
# (413 to the client) after the upstream has seen its start.
stream_requests = false
# With stream_requests on, routes listed here stream even though the WAF or inbound DLP reads the
# body: the first `window` bytes are inspected before anything is forwarded, then every later frame
# with `overlap` bytes carried between frames. Weaker than whole-body inspection (a long match across
# a frame boundary is missed; a block after the window cuts an upload the upstream has started to
# see). DLP `redact` and LLM routes still buffer. See docs/CONFIG.md.
# [[validation.stream_inspect]]
# path = "/upload/"
# window = "64KiB"
# overlap = "4KiB"
# Tunnel WebSocket (and other `Upgrade`) connections to the upstream. Off by default: the normal
# path strips the hop-by-hop Upgrade/Connection headers, so a WebSocket handshake would be
# forwarded as a plain HTTP request and fail. Turn this on to proxy WS apps (chat, live
# dashboards, dev HMR): an authenticated, rate-limited upgrade request is forwarded intact and,
# on the upstream's 101, EdgeGuard splices the two connections into a raw bidirectional tunnel.
# Response hardening / WAF body inspection don't apply to a tunneled connection.
websocket_passthrough = false
# gzip-compress responses for clients that send `Accept-Encoding: gzip`. Off by default. Skips
# already-compressed content types and (always) `text/event-stream`, so SSE streaming is never
# held back by the compressor. Applied at the listener, so toggling it needs a restart.
compress_responses = false

[headers]
hsts = true
csp = "default-src 'self'"
# Send the CSP as Content-Security-Policy-Report-Only (collect violations without enforcing).
csp_report_only = false
# If set, a `report-uri <value>` directive is appended to the CSP. Point it at EdgeGuard's own
# sink to have reports logged + counted, or at any external collector.
# csp_report_uri = "/__edgeguard/csp-report"
referrer_policy = "no-referrer"
permissions_policy = "geolocation=(), microphone=(), camera=()"
frame_options = "DENY"
force_secure_cookies = true
strip = ["Server", "X-Powered-By"]

# --- WAF-lite input inspection (optional; OFF by default) ---
# Screens requests for common attack signatures before forwarding. These are heuristics, so it
# ships off and report-first: run "report" to log + count matches (edgeguard_waf_hits_total)
# without blocking, watch for false positives, then switch to "block" (returns 403). It runs
# after auth and the size/method checks; the internal /__edgeguard/* endpoints are never seen.
[waf]
mode = "off"            # "off" | "report" | "block"
sqli = true             # built-in SQL-injection heuristics
xss = true              # built-in cross-site-scripting heuristics
path_traversal = true   # built-in path-traversal heuristics
inspect_path = true     # inspect the URL path + query (matched raw AND percent-decoded)
inspect_headers = false # inspect header values (noisy: cookies/tokens) — opt in
inspect_body = false    # inspect the (size-capped) request body — opt in
# Operator-defined deny patterns, matched in addition to the built-ins. `pattern` is an RE2
# regex (linear-time, ReDoS-safe — no backreferences/lookaround). `target` is one of "path"
# (default), "headers", "body", "all"; a location is only inspected when its inspect_* flag
# above is on. A pattern that fails to compile is rejected on load (or kept-previous on reload).
# [[waf.rules]]
# id = "block-wp-probes"
# pattern = "(?i)/wp-(admin|login)"
# target = "path"

# --- IP access control (optional; allow-all by default) ---
# Coarse network gate by client IP, evaluated before auth and rate limiting. Both lists accept
# plain IPs and CIDR ranges (IPv4 and IPv6). `deny` wins over `allow`; a non-empty `allow` means
# "only these may connect". Both empty (the default) = allow all. A bad entry fails at startup.
# NB: keys on the resolved client IP — behind a trusted proxy/LB, set server.trust_forwarded_for
# so this sees the real client rather than the proxy.
# --- OTLP metrics (optional) ---
# Push every metric /__edgeguard/metrics serves to an OpenTelemetry collector, for pipelines that
# do not scrape. Edge-local: a control plane cannot repoint it.
# Per-consumer series (edgeguard_consumer_*): one per authenticated principal, up to this many;
# the rest share "_over_cap". 0 turns them off (for principals that are personal data).
# [metrics]
# consumer_series_max = 100
# [metrics.otlp]
# enabled = true
# endpoint = "http://otel-collector:4318/v1/metrics"
# interval_secs = 60
# Every section with a URL the edge calls (metrics.otlp, tracing, log.ship, auth.jwt, alerts,
# llm.telemetry, tls.acme, tls.acme.dns, control_plane) also takes the same four keys. A private CA (https://
# only) replaces the public roots for that client; the client certificate is re-read on change;
# proxy = "" takes [outbound] (then HTTPS_PROXY), "http://host:port" tunnels this client alone,
# "none" goes direct.
# ca_path = "/etc/eggrd/corp-ca.pem"
# client_cert_path = "/etc/eggrd/edge.pem"
# client_key_path = "/etc/eggrd/edge.key"
# proxy = "http://egress.corp:3128"

# Defaults for all of those sections, for the keys each leaves empty: an egress proxy, the edge's
# identity, a corporate CA. extra_ca_path is trusted beside the public roots, not instead of them,
# so public endpoints (a chat webhook, a SaaS JWKS) keep working; there is no ca_path here. The CA
# and certificate reach https:// URLs only. Edge-local. A section opts out of the proxy with
# proxy = "none".
# [outbound]
# proxy = "http://egress.corp:3128"
# extra_ca_path = "/etc/eggrd/corp-ca.pem"
# client_cert_path = "/etc/eggrd/edge.pem"
# client_key_path = "/etc/eggrd/edge.key"

[log]
# What the access log records. The request line is the most useful field in an access log and the
# easiest place to leak a secret: password-reset links, OAuth `?code=`, presigned URLs and
# `?api_key=` all travel in the query string, and access logs are scraped, shipped to a SIEM,
# retained for months and read by people who were never meant to hold the credential.
#
#   query = "redact"  (default) redact values that are sensitive by NAME (api_key, token, code,
#                     email, …) or by SHAPE (a JWT, a long high-entropy token). Ordinary values —
#                     page numbers, slugs, dates, search terms — stay readable.
#   query = "drop"    log the path only; the query becomes `?<dropped>`.
#   query = "full"    verbatim. Opt-in, for a deployment that has decided its logs are as sensitive
#                     as its traffic and protects them accordingly.
#
# Only the LOG is affected. The upstream, the WAF, per-route limits and routing all see the request
# exactly as it arrived — redacting those would break routing and blind the security pipeline.
# Path segments are not redacted: `/reset/<token>` cannot be told from `/users/<id>` without knowing
# the application's routes. Use `drop` if secrets ride in path segments.
query = "redact"

# Extra parameter names to treat as sensitive, on top of the built-in list. Matched
# case-insensitively as substrings.
redact_params = []

# Who made the request: the authenticated principal (apikey:<id> — a hash, never the key — the
# Basic user, the JWT sub, the client certificate's name). "full" (default), "hash" (sha256:<16
# hex>: one caller's lines still correlate, but the name is not written), or "off".
principal = "full"

[access]
allow = []   # e.g. ["10.0.0.0/8", "203.0.113.7"]  — lock the app to an office/VPN range
deny = []    # e.g. ["198.51.100.0/24"]            — drop an abusive subnet (wins over allow)

# --- CORS (optional; OFF by default) ---
# Cross-Origin Resource Sharing. Turn this on when the app's browser frontend is served from a
# DIFFERENT origin than EdgeGuard (a separate static host, a preview URL, localhost:5173 in dev) —
# otherwise the browser blocks those cross-origin fetch/XHR calls. EdgeGuard answers preflight
# OPTIONS requests itself (before auth — a preflight carries no credentials) and adds the matching
# Access-Control-* headers to actual responses.
[cors]
enabled = false
# Allowed origins, matched exactly (scheme + host + port). The single entry ["*"] allows any
# origin, but a wildcard CANNOT be combined with allow_credentials = true (rejected at startup).
allow_origins = []                # e.g. ["https://app.example.com", "http://localhost:5173"]
# Methods advertised in the preflight. [] = a sensible default (GET/POST/PUT/PATCH/DELETE/OPTIONS/HEAD).
allow_methods = []
# Request headers advertised in Access-Control-Allow-Headers. [] = reflect what the browser asks
# for in Access-Control-Request-Headers (the common, permissive default).
allow_headers = []
# Response headers the browser page is allowed to read. [] = only the CORS-safelisted set.
expose_headers = []
# Send Access-Control-Allow-Credentials: true so the browser may include cookies / HTTP auth.
# Requires an explicit allow_origins list (no "*").
allow_credentials = false
# How long the browser may cache the preflight result. "0" omits Access-Control-Max-Age.
max_age = "600s"

# --- TLS termination (optional) ---
# When enabled, EdgeGuard serves HTTPS on the public port. Provide a certificate via
# cert_path/key_path, or have ACME obtain one automatically (see [tls.acme]).
[tls]
enabled = false
cert_path = ""   # PEM certificate chain (leaf first)
key_path = ""    # PEM private key (PKCS#8/PKCS#1/SEC1)

# --- Self-signed certificate (no certificate needed to turn TLS on) ---
# Generates a certificate at cert_path/key_path when none is there yet, so `enabled = true` does
# not first require you to obtain one. It ENCRYPTS the connection — which is what makes HSTS,
# Secure cookies and the hardening headers mean anything — but it proves NO IDENTITY: browsers
# show an interstitial and strict clients refuse it. Right for localhost, a private network, a
# sidecar hop or staging; for a public domain use [tls.acme] below instead.
# Skipped once a certificate exists, so restarts keep serving the same one. Generate one ahead of
# time with: edgeguard cert --host app.internal --days 90
self_signed = false
# SANs; empty = ["localhost", "127.0.0.1", "::1"]. Add the name you actually browse to. An entry
# that parses as an IP becomes an IP SAN; anything else must be a valid ASCII DNS name, and one
# that is not fails generation rather than silently dropping it from the certificate.
self_signed_hosts = []
self_signed_days = 90    # deliberately short — a stopgap that expires beats one that never does
# Regenerate before expiry (at two-thirds of the lifetime) and serve it without a restart. Only a
# certificate that is itself self-signed is replaced, never a CA-issued one at the same path.
self_signed_renew = true
self_signed_rotate_key = false   # keep the key across renewals, so clients pinning it keep working
# MULTI-REPLICA: generation is per-process. Several replicas booting at once against the SAME
# writable cert_path can each see "no certificate" and generate, and the last writer wins — the
# replicas then serve different certificates, or one fails to start on a mismatched pair. There
# is no cross-process lock here. Generate once up front (`edgeguard cert`) and mount the result
# read-only when you run more than one replica; first-boot generation is for a single instance.

# Reload cert_path/key_path when they change on disk — cert-manager, Vault Agent, certbot, a mounted
# Kubernetes secret — with no restart and no dropped connections. A pair that does not load is
# rejected and the current one keeps serving.
watch = true

# --- HTTP → HTTPS redirect ---
# Terminating TLS only protects traffic that REACHES the TLS port, and a browser given a bare
# hostname tries :80 first — so without this, the first request of every visit is still plaintext
# (or a connection error). Set redirect_port = 80 alongside [server] port = 443.
# Ports below 1024 need privilege or CAP_NET_BIND_SERVICE. Overridden by REDIRECT_PORT.
redirect_port = 0        # 0 = off; 80 = catch plaintext and upgrade it
# 308 preserves the method and body, so a POST arriving on the plaintext port is replayed over
# TLS rather than silently downgraded to a GET. 301 is the older browser-facing convention.
redirect_status = 308
# Hostnames the redirect will reflect into Location. Empty accepts any syntactically valid host
# (the usual proxy behaviour). The Host header is attacker-controlled, so listing the names you
# actually serve is what stops a forged Host producing a redirect that appears to come from your
# domain. Malformed hosts (spaces, CR/LF, userinfo) are always refused with 400.
redirect_hosts = []      # e.g. ["app.example.com"]

# More certificates on this listener, chosen by the hostname the client asks for (SNI). The pair
# above stays the default (any other name, or no name). Each extra pair is reloaded when it changes
# on disk and warned about near expiry, but not renewed here. `hosts` is required: exact names or a
# one-label wildcard ("*.example.com"); an exact name wins over a wildcard.
# [[tls.certs]]
# cert_path = "/etc/eggrd/api.crt"
# key_path = "/etc/eggrd/api.key"
# hosts = ["api.example.com"]

# Client certificates (mutual TLS) on this listener. "required": no certificate from a CA in
# ca_path, no connection. "optional": verified if presented (pair with auth.mode = "mtls" to answer
# clients without one with 401). The CA bundle and CRLs reload when they change on disk. While on,
# TLS session resumption is off, so a revoked certificate cannot keep connecting on an old session.
# [tls.client_auth]
# mode = "required"
# ca_path = "/etc/eggrd/client-ca.pem"
# crl_paths = ["/etc/eggrd/client-ca.crl"]
# forward_client_cert = "xfcc"   # send the app X-Forwarded-Client-Cert for the verified certificate

# A client certificate a TLS-terminating load balancer verified and forwards in a header (an ALB in
# mTLS verify mode, nginx, HAProxy, Envoy/Istio, Traefik). Believed only from the balancer: by
# trusted_proxies (the connection's own peer, never X-Forwarded-For), or by trusted_proxy_names
# (the TLS client certificate the connection presented); removed before forwarding either way.
# From the balancer, the connection's own client certificate is the balancer's, never the
# client's. Edge-local.
# [trusted_client_cert_header]
# name = "X-Amzn-Mtls-Clientcert"
# format = "pem"                       # pem | der | xfcc
# trusted_proxies = ["10.0.0.0/20"]
# trusted_proxy_names = ["spiffe://prod.example/ns/ingress/*"]  # or by the balancer's TLS client
#                                      # certificate (needs [tls.client_auth]); both set: both match
# ca_path = ""                         # also verify it, for a balancer that forwards unchecked

# Automatic certificates via ACME / Let's Encrypt (HTTP-01 challenge on port 80). The issued
# certificate is written to the cert_path/key_path above. NOTE: requires a public domain and
# inbound :80; the default directory is Let's Encrypt STAGING so a first run can't burn the
# strict production rate limits — switch to production explicitly when ready.
[tls.acme]
enabled = false
domains = []          # e.g. ["app.example.com"]
email = ""            # ACME account contact
directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"
cache_dir = "./acme"  # stores the ACME account key for renewals
accept_tos = false    # must be true to accept the provider's Terms of Service
# Renew at two-thirds of the certificate's lifetime while running; new connections get the renewed
# certificate with no restart. With redirect_port = 80 the redirect listener answers the challenge.
renew = true
# "http-01" (default): the CA fetches a token from port 80. "dns-01": the order publishes a TXT
# record through [tls.acme.dns] instead — required for wildcards ("*.example.com") and for hosts the
# CA cannot reach on :80.
challenge = "http-01"
# How ACME requests reach the CA: a proxy ("" takes [outbound], then HTTPS_PROXY), or a CA bundle
# that replaces the trust for the directory. With neither, it trusts the operating system's store
# (where a private ACME CA's root can be installed), not the roots built into the binary.
# proxy = "http://egress.corp:3128"
# ca_path = "/etc/eggrd/acme-ca.pem"

# DNS-01 provider (only read when challenge = "dns-01"). The API token is read from the environment
# variable named here, never from this file: a Cloudflare token with Zone.DNS:Edit on this zone only.
# [tls.acme.dns]
# provider = "cloudflare"
# zone_id = ""                         # the zone's ID (Overview page)
# api_token_env = "CLOUDFLARE_API_TOKEN"
# propagation_secs = 30                # wait before the CA looks for the record

# ── Managed mode (optional) ───────────────────────────────────────────────────────────────
# Pull this edge's policy from a remote control plane and report operational metrics to it. OFF
# by default — leave disabled to run as a standalone proxy. When enabled, the control plane pushes
# the policy sections (auth/ratelimit/validation/headers/waf); this edge keeps its own [server]/[tls].
# The edge token is a secret — prefer the EDGEGUARD_CP_EDGE_TOKEN env var over this file.
[control_plane]
enabled = false
url = ""               # control-plane base URL, e.g. "https://cp.example"
tenant_id = ""         # this edge's id at the control plane
edge_token = ""        # edge bearer token (prefer EDGEGUARD_CP_EDGE_TOKEN)
poll_interval = "30s"  # how often to pull policy
report_interval = "60s" # how often to flush a metrics delta
forward_csp = true     # forward received CSP reports to the control plane
# Enforce the configured quota as a 429 hard-stop (turns the rate signal into a hard cap). OFF by
# default. When on, the edge polls the control plane's quota verdict and rejects traffic with
# 429 + Retry-After while the edge is over its quota; the internal /__edgeguard/* endpoints stay
# served. Prefer EDGEGUARD_CP_QUOTA_ENFORCE.
enforce_quota = false
quota_poll_interval = "30s"  # how often to poll the quota verdict
# Keep the last policy pulled from the control plane on disk (written 0600, holds its secrets), so
# a restart while the control plane is down starts on it instead of on this file alone.
# cache_path = "/var/lib/eggrd/policy.json"
# Until a pushed policy is applied: "local" serves on this file; "refuse" answers 503 (and
# /__edgeguard/ready 503) instead.
boot_without_policy = "local"
# A control plane behind a private CA: trust only these CAs for it (needs an https:// url).
# ca_path = "/etc/eggrd/cp-ca.pem"
# This edge's client certificate, for a control plane that requires one (re-read on change).
# client_cert_path = "/etc/eggrd/edge.pem"
# client_key_path = "/etc/eggrd/edge.key"
# "" takes [outbound] proxy, then HTTPS_PROXY/NO_PROXY; "http://[user:pass@]host:port" tunnels
# this client alone through that CONNECT proxy; "none" connects directly.
# proxy = "http://egress.corp:3128"
