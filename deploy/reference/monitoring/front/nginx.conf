# "front": an L7 proxy in front of the edge (an ALB stand-in) that appends the client to
# X-Forwarded-For, so edgeguard_forwarded_for_total{result="used"} moves. Traffic that reaches
# the edge directly has no header and counts as "absent".
events {}
http {
  access_log off;
  server {
    listen 8080;
    location / {
      proxy_set_header Host app.example.test;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_ssl_server_name on;
      proxy_ssl_name app.example.test;
      proxy_pass https://edge:443;
    }
  }
}
