# Local stand-in for CloudFront in front of the ALB stand-in: appends the viewer's address and
# forwards to the ALB, which appends CloudFront's. eggrd then needs forwarded_hops = 2.
events {}
http {
  access_log off;
  server {
    listen 8000;
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://alb:8002;
    }
  }
}
