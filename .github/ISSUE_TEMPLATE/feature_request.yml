name: Feature request
description: Something EdgeGuard should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today. Start here rather than with a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would solve it
      description: A config key, a behaviour, an endpoint. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: A workaround, another tool in front of or behind EdgeGuard, or nothing.
