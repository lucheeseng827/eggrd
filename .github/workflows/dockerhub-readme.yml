# Syncs docs/DOCKERHUB.md to the mancube/eggrd Docker Hub repository overview.
#
# This workflow runs on the public eggrd repository. It is authored upstream and shipped here
# by the release pipeline, so edit it upstream rather than in place — a direct edit is
# overwritten by the next sync.
#
# It previously existed only on the mirror, hand-placed and never tracked upstream. When the
# sync began mirroring `.github/workflows/`, `rsync -a --delete` removed it, and the Docker Hub
# overview silently stopped updating — the page kept advertising 0.2.1 while 0.3.0 shipped.
# Anything the mirror needs must live in `.ossync.yaml`, or the next sync deletes it.
#
# Kept separate from release.yml so the page can be refreshed without rebuilding images.
name: dockerhub-readme

on:
  push:
    branches: [main]
    paths: ["docs/DOCKERHUB.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    environment: cicd
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Push overview to Docker Hub
        # v4 pinned by digest. v5.0.0 exists; this is a restore of a workflow that was known to
        # work, so the version bump is deliberately left as a separate decision.
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: mancube/eggrd
          readme-filepath: ./docs/DOCKERHUB.md
          short-description: "Drop-in Rust edge proxy: auth, rate limiting, WAF, hardened headers — zero app changes."
