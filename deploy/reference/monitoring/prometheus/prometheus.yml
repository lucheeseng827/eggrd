global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml        # the monitoring bundle's (monitoring/prometheus/alerts.yml)
  - /etc/prometheus/rules-0.7.yml     # this setup's two 0.7 listener alerts

scrape_configs:
  # The edge's admin listener. In Kubernetes, scrape the eggrd-admin Service (or a PodMonitor) from
  # the namespace the edge's NetworkPolicy admits on 9090.
  - job_name: edgeguard
    metrics_path: /__edgeguard/metrics
    static_configs:
      - targets: ["edge:9090"]
        labels:
          service: edgeguard
