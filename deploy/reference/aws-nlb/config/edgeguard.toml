# eggrd 0.7 behind an AWS NLB with PROXY protocol v2 (IP targets). The base Kubernetes policy plus
# the [server] settings an NLB needs. Passes `edgeguard doctor` with 0 errors on 0.7.0 (and one
# expected warning: the drain is 30 s or more, covered by terminationGracePeriodSeconds: 60).
# Replace app.example.test (the Host rule with ../tools/host-rule.sh <host>), the upstream, and
# the NLB's subnets below.
#
# Delivered as a kustomize-generated ConfigMap (eggrd-config-<hash>): an edit rolls the pods.
# Do not rely on eggrd hot-reloading a ConfigMap volume edited in place: it did on k3s v1.31.14
# (27–62 s after the edit, at the kubelet's `..data` swap), not in one run on k3s v1.33.4 with the
# Docker runtime, and is untested elsewhere. The roll is the reload.

[server]
port = 443                   # also what the :80 redirect writes into Location
upstream = "http://whoami.eggrd-app.svc.cluster.local:8000"
admin_port = 9090
admin_addr = "0.0.0.0"       # kubelet probes and Prometheus reach it; the NetworkPolicy fences it
# An NLB with IP targets connects from its own private addresses, so the TCP peer is the NLB. It
# names the client in a PROXY protocol v2 header, which eggrd believes only from these CIDRs: the
# subnets the NLB has a node in (its ENIs). A /0 is refused. Client IP preservation must be OFF on
# the target group (preserve_client_ip.enabled=false): with it on, connections arrive from the
# clients' own addresses with a header, are refused as untrusted, and every client is cut off
# while the health check (from the NLB's addresses) still passes. EdgeGuardProxyProtocolRefused
# catches that; deploy it (prometheusrule.yaml).
proxy_protocol = true
proxy_protocol_trusted = ["10.0.0.0/24", "10.0.1.0/24"]
# Never with proxy_protocol: an L4 balancer forwards the client's own X-Forwarded-For.
trust_forwarded_for = false
header_read_timeout = "30s"
max_connections = 2048
# An NLB keeps opening connections to a deregistering target for about 15 s, so keep accepting
# for 25 s after SIGTERM (20-30 s; 15 s let 1 request in 7,963 be refused in an EKS rollout), then
# finish in-flight requests for up to 25 s. terminationGracePeriodSeconds is 60 to cover both.
# doctor warns that 50 s exceeds Kubernetes' default 30 s grace period: expected here.
drain_delay = "25s"
drain_timeout = "25s"

[tls]
enabled = true
cert_path = "/etc/eggrd-tls/tls.crt"     # the eggrd-tls Secret (cert-manager in production)
key_path = "/etc/eggrd-tls/tls.key"
redirect_port = 80
redirect_status = 308
redirect_hosts = ["app.example.test"]

[headers]
hsts = true
csp = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
csp_report_only = false
frame_options = "DENY"
force_secure_cookies = true
strip = ["Server", "X-Powered-By"]

[waf]
# Ship report first on a live app: mode = "report", read the "WAF rule matched (report-only)"
# lines (kubectl -n eggrd-edge logs deploy/eggrd | grep WAF), then block.
mode = "block"
sqli = true
xss = true
path_traversal = true
inspect_path = true
inspect_headers = true
inspect_body = false

# Refuse every Host but app.example.test (or app.example.test:443). Generated by deploy/reference/tools/host-rule.sh.
# Needs [waf] mode = "block" and inspect_headers = true. Replace with allowed_hosts on 0.8.
[[waf.rules]]
id      = "host-allowlist"
target  = "headers"
pattern = '(?mi)^host:[ \t]*(?:|a|ap|app|app\.|app\.e|app\.ex|app\.exa|app\.exam|app\.examp|app\.exampl|app\.example|app\.example\.|app\.example\.t|app\.example\.te|app\.example\.tes|[^a \t\n].*|a[^p\n].*|ap[^p\n].*|app[^.\n].*|app\.[^e\n].*|app\.e[^x\n].*|app\.ex[^a\n].*|app\.exa[^m\n].*|app\.exam[^p\n].*|app\.examp[^l\n].*|app\.exampl[^e\n].*|app\.example[^.\n].*|app\.example\.[^t\n].*|app\.example\.t[^e\n].*|app\.example\.te[^s\n].*|app\.example\.tes[^t\n].*|app\.example\.test[^:\n].*|app\.example\.test:|app\.example\.test:4|app\.example\.test:44|app\.example\.test:[^4\n].*|app\.example\.test:4[^4\n].*|app\.example\.test:44[^3\n].*|app\.example\.test:443.+)[ \t]*$'

[ratelimit]
enabled = true
# Per replica with store = "local": two replicas allow twice this. For one limit across the
# fleet use store = "redis" (EDGEGUARD_REDIS_URL from a Secret).
rate = "120/min"
burst = 30
store = "local"

[[ratelimit.routes]]
path = "/login"
rate = "5/min"
burst = 3
name = "login"

[validation]
max_body = "5MiB"
upstream_timeout = "30s"
upstream_connect_timeout = "5s"
allow_methods = ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]

[log]
query = "redact"
principal = "hash"
