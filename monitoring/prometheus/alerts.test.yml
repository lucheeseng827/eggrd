# promtool unit tests for alerts.yml: the edgeguard-api alerts (PROXY protocol included), and the
# certificate alerts on the client certificates and CRLs the edge depends on:
#
#   promtool test rules monitoring/prometheus/alerts.test.yml
#
# Each case gives a firing input and inputs that must not fire (under the traffic guard, still
# answering, below the threshold, or before `for:` has elapsed). promtool compares annotations
# exactly, so the expected ones are the rules' own templates with these labels filled in.

rule_files:
- alerts.yml
evaluation_interval: 1m
tests:
- name: an upstream failing more than 5%, one not answering, and two that must stay quiet
  interval: 1m
  input_series:
  - series: edgeguard_upstream_requests_total{upstream="http://api:8080",result="ok"}
    values: 0+60x20
  - series: edgeguard_upstream_requests_total{upstream="http://api:8080",result="connect_error"}
    values: 0+12x20
  - series: edgeguard_upstream_requests_total{upstream="http://web:8080",result="ok"}
    values: 0+60x20
  - series: edgeguard_upstream_requests_total{upstream="http://web:8080",result="http_5xx"}
    values: '0x20'
  - series: edgeguard_upstream_requests_total{upstream="http://batch:8080",result="ok"}
    values: 0+1x20
  - series: edgeguard_upstream_requests_total{upstream="http://batch:8080",result="timeout"}
    values: 0+1x20
  - series: edgeguard_upstream_requests_total{upstream="http://down:8080",result="ok"}
    values: '0x20'
  - series: edgeguard_upstream_requests_total{upstream="http://down:8080",result="connect_error"}
    values: 0+1x20
  alert_rule_test:
  - eval_time: 3m
    alertname: EdgeGuardUpstreamErrorRatio
    exp_alerts: []
  - eval_time: 10m
    alertname: EdgeGuardUpstreamErrorRatio
    exp_alerts:
    - exp_labels:
        upstream: http://api:8080
        severity: critical
      exp_annotations:
        summary: 'Upstream http://api:8080: more than 5% of requests failing'
        description: 'More than 5% of the requests forwarded to http://api:8080 over the last 5m failed
          or were answered 5xx. edgeguard_upstream_requests_total by result says how: connect_error is
          down or unreachable, tls_error a CA or client-certificate mismatch, timeout slow past validation.upstream_timeout,
          reset a crash mid-response, http_5xx the upstream''s own error.'
  - eval_time: 3m
    alertname: EdgeGuardUpstreamNotAnswering
    exp_alerts: []
  - eval_time: 10m
    alertname: EdgeGuardUpstreamNotAnswering
    exp_alerts:
    - exp_labels:
        upstream: http://down:8080
        severity: critical
      exp_annotations:
        summary: Upstream http://down:8080 is not answering
        description: Every request forwarded to http://down:8080 for 5m has failed without an answer.
          Clients are getting 502 or 504. Check that it is running and reachable from the edge; the result
          label on edgeguard_upstream_requests_total says whether the connection, the TLS handshake or
          the response failed.
- name: a route whose p99 regressed against the same hour yesterday
  interval: 1m
  input_series:
  - series: edgeguard_route_request_duration_seconds_bucket{route="api",le="0.1"}
    values: 0+10x1460 14600x59
  - series: edgeguard_route_request_duration_seconds_bucket{route="api",le="0.25"}
    values: 0+10x1460 14600x59
  - series: edgeguard_route_request_duration_seconds_bucket{route="api",le="0.5"}
    values: 0+10x1460 14600x59
  - series: edgeguard_route_request_duration_seconds_bucket{route="api",le="1"}
    values: 0+10x1520
  - series: edgeguard_route_request_duration_seconds_bucket{route="api",le="+Inf"}
    values: 0+10x1520
  - series: edgeguard_route_requests_total{route="api",method="GET",status_class="2xx"}
    values: 0+10x1520
  alert_rule_test:
  - eval_time: 1450m
    alertname: EdgeGuardRouteLatencyRegression
    exp_alerts: []
  - eval_time: 1500m
    alertname: EdgeGuardRouteLatencyRegression
    exp_alerts:
    - exp_labels:
        route: api
        severity: warning
      exp_annotations:
        summary: 'Route api: p99 latency more than doubled since yesterday'
        description: The 99th-percentile time to response headers on route api is over 250ms and more
          than twice what it was at this hour yesterday. Compare edgeguard_upstream_duration_seconds for
          the upstream behind it (the upstream got slower) with edgeguard_edge_overhead_seconds (the edge
          did).
- name: a listener above 80% of its connection cap, and one well below
  interval: 1m
  input_series:
  - series: edgeguard_connections_open{instance="edge-1:9090",job="edgeguard",listener="public"}
    values: 90x15
  - series: edgeguard_connections_max{instance="edge-1:9090",job="edgeguard",listener="public"}
    values: 100x15
  - series: edgeguard_connections_open{instance="edge-1:9090",job="edgeguard",listener="redirect"}
    values: 10x15
  - series: edgeguard_connections_max{instance="edge-1:9090",job="edgeguard",listener="redirect"}
    values: 100x15
  alert_rule_test:
  - eval_time: 2m
    alertname: EdgeGuardConnectionsNearCap
    exp_alerts: []
  - eval_time: 10m
    alertname: EdgeGuardConnectionsNearCap
    exp_alerts:
    - exp_labels:
        instance: edge-1:9090
        job: edgeguard
        listener: public
        severity: warning
      exp_annotations:
        summary: Listener public on edge-1:9090 is above 80% of its connection cap
        description: Open connections on the public listener have been above 80% of server.max_connections
          for 5m. Past the cap, new connections are closed at accept (edgeguard_connections_rejected_total).
          Raise the cap, add replicas, or find what is holding connections open.
- name: client certificates refused at 0.5/s, beside handshake timeouts that do not count
  interval: 1m
  input_series:
  - series: edgeguard_tls_handshake_failures_total{instance="edge-1:9090",job="edgeguard",listener="public",reason="client_cert"}
    values: 0+30x20
  - series: edgeguard_tls_handshake_failures_total{instance="edge-1:9090",job="edgeguard",listener="admin",reason="timeout"}
    values: 0+60x20
  alert_rule_test:
  - eval_time: 5m
    alertname: EdgeGuardClientCertRejectSpike
    exp_alerts: []
  - eval_time: 15m
    alertname: EdgeGuardClientCertRejectSpike
    exp_alerts:
    - exp_labels:
        instance: edge-1:9090
        listener: public
        severity: warning
      exp_annotations:
        summary: Listener public on edge-1:9090 is refusing many client certificates
        description: 'More than one TLS handshake every 5s has been refused for its client certificate
          for 10m: none presented, an unknown CA, revoked or expired. Usual causes are client certificates
          expiring together, clients moved to a CA missing from tls.client_auth.ca_path, a revocation,
          or a scan.'
- name: a client certificate nearing expiry fires the existing expiry alert
  interval: 1m
  input_series:
  - series: edgeguard_tls_cert_not_after_seconds{instance="edge-1:9090",job="edgeguard",source="file",cert="client:/etc/eggrd/edge.pem"}
    values: 871200x180
  - series: edgeguard_tls_cert_not_after_seconds{instance="edge-1:9090",job="edgeguard",source="acme"}
    values: 8640000x180
  alert_rule_test:
  - eval_time: 2h
    alertname: EdgeGuardCertExpiringSoon
    exp_alerts:
    - exp_labels:
        instance: edge-1:9090
        job: edgeguard
        source: file
        cert: client:/etc/eggrd/edge.pem
        severity: warning
      exp_annotations:
        summary: TLS certificate on edge-1:9090 expires in under 14 days
        description: Renewal (file) runs at two-thirds of the certificate's lifetime, so a certificate
          this close to expiry means renewal is failing or nothing renews it. Check GET /__edgeguard/tls
          for the last renewal attempt and its error. For source="file", replace the files — the proxy
          reloads them without a restart.
- name: a CRL past its nextUpdate, beside one that is current
  interval: 1m
  input_series:
  - series: edgeguard_tls_crl_next_update_seconds{instance="edge-1:9090",job="edgeguard",crl="/etc/eggrd/partners.crl"}
    values: 600x40
  - series: edgeguard_tls_crl_next_update_seconds{instance="edge-1:9090",job="edgeguard",crl="/etc/eggrd/staff.crl"}
    values: 86400x40
  alert_rule_test:
  - eval_time: 5m
    alertname: EdgeGuardCrlStale
    exp_alerts: []
  - eval_time: 15m
    alertname: EdgeGuardCrlStale
    exp_alerts: []
  - eval_time: 30m
    alertname: EdgeGuardCrlStale
    exp_alerts:
    - exp_labels:
        instance: edge-1:9090
        job: edgeguard
        crl: /etc/eggrd/partners.crl
        severity: warning
      exp_annotations:
        summary: CRL /etc/eggrd/partners.crl on edge-1:9090 is past its next update
        description: The CA has published a newer revocation list than /etc/eggrd/partners.crl. The edge
          goes on using this one, so client certificates revoked since are still accepted. Fetch the current
          CRL into the same file; it is reloaded without a restart.
- name: forwarded client certificates refused from an untrusted peer, beside ones that are not
  interval: 1m
  input_series:
  - series: edgeguard_client_cert_header_total{instance="edge-1:9090",job="edgeguard",result="untrusted_peer"}
    values: 0+30x20
  - series: edgeguard_client_cert_header_total{instance="edge-1:9090",job="edgeguard",result="accepted"}
    values: 0+600x20
  - series: edgeguard_client_cert_header_total{instance="edge-1:9090",job="edgeguard",result="invalid"}
    values: 0+3x20
  alert_rule_test:
  - eval_time: 5m
    alertname: EdgeGuardClientCertHeaderRefused
    exp_alerts: []
  - eval_time: 15m
    alertname: EdgeGuardClientCertHeaderRefused
    exp_alerts:
    - exp_labels:
        instance: edge-1:9090
        result: untrusted_peer
        severity: warning
      exp_annotations:
        summary: edge-1:9090 is refusing forwarded client certificates (untrusted_peer)
        description: 'More than one request every 10s for 10m had its trusted_client_cert_header refused
          (untrusted_peer), so it carried no client certificate. untrusted_peer: the header came from
          outside trusted_proxies, either a client forging it or a load balancer whose addresses are no
          longer listed. invalid: the balancer writes a different format than format says. unverified:
          the certificate failed the header''s ca_path or crl_paths.'
- name: connections closed for an untrusted PROXY header, beside results that must stay quiet
  interval: 1m
  input_series:
  - series: edgeguard_proxy_protocol_total{instance="edge-1:9090",job="edgeguard",listener="public",result="untrusted"}
    values: 0+30x20
  - series: edgeguard_proxy_protocol_total{instance="edge-1:9090",job="edgeguard",listener="public",result="invalid"}
    values: 0+3x20
  - series: edgeguard_proxy_protocol_total{instance="edge-1:9090",job="edgeguard",listener="public",result="proxied"}
    values: 0+600x20
  - series: edgeguard_proxy_protocol_total{instance="edge-1:9090",job="edgeguard",listener="redirect",result="direct"}
    values: 0+60x20
  alert_rule_test:
  - eval_time: 3m
    alertname: EdgeGuardProxyProtocolRefused
    exp_alerts: []
  - eval_time: 12m
    alertname: EdgeGuardProxyProtocolRefused
    exp_alerts:
    - exp_labels:
        instance: edge-1:9090
        listener: public
        result: untrusted
        severity: critical
      exp_annotations:
        summary: Listener public on edge-1:9090 is closing connections for their PROXY header (untrusted)
        description: 'More than one connection every 10s for 5m was closed for its PROXY protocol header
          (untrusted), and the clients behind it got no answer. untrusted: the header came from outside
          server.proxy_protocol_trusted, because the balancer''s addresses changed or it preserves client
          IPs, so the peer is the client. invalid: what the peer sends is not a PROXY header.'
- name: a balancer that sends no PROXY headers, beside one whose health checks only do not
  interval: 1m
  input_series:
  - series: edgeguard_proxy_protocol_total{instance="edge-1:9090",job="edgeguard",listener="public",result="missing"}
    values: 0+60x40
  - series: edgeguard_proxy_protocol_total{instance="edge-1:9090",job="edgeguard",listener="public",result="proxied"}
    values: '0x40'
  - series: edgeguard_proxy_protocol_total{instance="edge-2:9090",job="edgeguard",listener="public",result="missing"}
    values: 0+2x40
  - series: edgeguard_proxy_protocol_total{instance="edge-2:9090",job="edgeguard",listener="public",result="proxied"}
    values: 0+600x40
  alert_rule_test:
  - eval_time: 10m
    alertname: EdgeGuardProxyProtocolMissing
    exp_alerts: []
  - eval_time: 35m
    alertname: EdgeGuardProxyProtocolMissing
    exp_alerts:
    - exp_labels:
        instance: edge-1:9090
        listener: public
        severity: warning
      exp_annotations:
        summary: The balancer in front of listener public on edge-1:9090 sends no PROXY headers
        description: 'For 15m, connections from server.proxy_protocol_trusted arrived without a PROXY
          protocol header and none with one, so every client is served as the balancer: one shared rate
          limit, and access rules and logs that see the balancer''s address. Enable proxy protocol on
          the balancer (the NLB target group, HAProxy''s server line).'
- name: a pool with no target in rotation, a pool missing one, and a failed-over target
  interval: 1m
  input_series:
  - series: edgeguard_upstream_in_rotation{instance="edge-1:9090",job="edgeguard",route="app",upstream="http://a:8080"}
    values: '0x21'
  - series: edgeguard_upstream_in_rotation{instance="edge-1:9090",job="edgeguard",route="app",upstream="http://b:8080"}
    values: 1x21
  - series: edgeguard_upstream_in_rotation{instance="edge-1:9090",job="edgeguard",route="api",upstream="http://c:8080"}
    values: 1x4 0x16
  - series: edgeguard_upstream_in_rotation{instance="edge-1:9090",job="edgeguard",route="api",upstream="http://d:8080"}
    values: 1x4 0x16
  - series: edgeguard_upstream_requests_total{upstream="http://a:8080",result="connect_error"}
    values: 0+2x21
  - series: edgeguard_upstream_requests_total{upstream="http://a:8080",result="ok"}
    values: '0x21'
  alert_rule_test:
  - eval_time: 3m
    alertname: EdgeGuardUpstreamPoolDown
    exp_alerts: []
  - eval_time: 12m
    alertname: EdgeGuardUpstreamPoolDown
    exp_alerts:
    - exp_labels:
        instance: edge-1:9090
        route: api
        severity: critical
      exp_annotations:
        summary: Every target of route api on edge-1:9090 is out of rotation
        description: For 1m no target of the api pool has passed its health check or accepted a connection.
          Requests still try each in turn, and most likely fail with 502. edgeguard_upstream_health_checks_total
          and the edge's log say why each one is out.
  - eval_time: 3m
    alertname: EdgeGuardUpstreamTargetOut
    exp_alerts: []
  - eval_time: 12m
    alertname: EdgeGuardUpstreamTargetOut
    exp_alerts:
    - exp_labels:
        instance: edge-1:9090
        job: edgeguard
        route: app
        upstream: http://a:8080
        severity: warning
      exp_annotations:
        summary: Target http://a:8080 of route app on edge-1:9090 is out of rotation
        description: 'For 5m http://a:8080 has been out of the app pool: failing its health check, or
          ejected by requests that could not connect to it or that it answered 5xx. The pool''s other
          targets are taking its requests.'
  - eval_time: 12m
    alertname: EdgeGuardUpstreamNotAnswering
    exp_alerts: []
- name: a target ejected again and again, beside one ejected once
  interval: 1m
  input_series:
  - series: edgeguard_upstream_ejections_total{instance="edge-1:9090",job="edgeguard",route="app",upstream="http://a:8080",reason="http_5xx"}
    values: 0+0.5x40
  - series: edgeguard_upstream_ejections_total{instance="edge-1:9090",job="edgeguard",route="app",upstream="http://b:8080",reason="connect_error"}
    values: 0 1x40
  alert_rule_test:
  - eval_time: 3m
    alertname: EdgeGuardUpstreamTargetFlapping
    exp_alerts: []
  - eval_time: 25m
    alertname: EdgeGuardUpstreamTargetFlapping
    exp_alerts:
    - exp_labels:
        instance: edge-1:9090
        route: app
        upstream: http://a:8080
        severity: warning
      exp_annotations:
        summary: Target http://a:8080 of route app on edge-1:9090 keeps being ejected
        description: 'http://a:8080 has been taken out of the app pool at least 3 times in 15m, each time
          returning after eject_for and failing again. The reason label on edgeguard_upstream_ejections_total
          says why: connect_error (requests could not connect) or http_5xx (it answered 5xx eject_after_5xx
          times in a row). GET /__edgeguard/upstreams shows the last error.'
