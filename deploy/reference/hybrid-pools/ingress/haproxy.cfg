# The ingress: the only container on both the public network and the internal site network. It
# passes TCP through to the edge (TLS stays end to end; eggrd terminates it) and names the client
# in a PROXY protocol v2 header. This is what lets the edge sit on the internal network alone,
# with no route out but the egress proxy. In production the same job is done by an L4 balancer or
# a host-level TCP forwarder.
#
# The header carries the address the ingress saw. That is the client's only when whatever forwards
# the published port keeps the source address: Docker's default userland proxy and rootless
# Docker/Podman port forwarding do NOT (every client then shares the forwarder's address, and so
# one rate-limit bucket). See README.md, "Client addresses through the ingress".
global
  log stdout format raw local0 info

# Resolve `edge` at run time, from the container's own resolver (Docker's or Podman's network
# DNS), so a recreated edge with a new address is followed without restarting the ingress.
resolvers netdns
  parse-resolv-conf
  hold valid 5s
  hold obsolete 10s

defaults
  mode tcp
  log global
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  default-server resolvers netdns init-addr last,libc,none resolve-prefer ipv4

frontend https
  bind :8443
  default_backend edge_https
frontend http
  bind :8080
  default_backend edge_http
frontend admin
  bind :9090
  default_backend edge_admin

backend edge_https
  server edge edge:443 send-proxy-v2
backend edge_http
  server edge edge:80 send-proxy-v2
backend edge_admin
  server edge edge:9090 send-proxy-v2
