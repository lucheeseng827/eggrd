  - id: EG-HARD-007
    title: "The edge cannot read the cloud metadata service"
    layer: "Network and placement"
    severity: Medium
    tags: []
    keys: []
    reference: [{setup: "kubernetes"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-007--the-edge-cannot-read-the-cloud-metadata-service"
    why: |-
      An SSRF in the app, or code execution in the edge's container, turns the metadata
      service into instance credentials. eggrd itself never calls it.
