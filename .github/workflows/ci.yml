# CI for EdgeGuard.
#
# This workflow runs on the public eggrd repository. It is authored upstream and shipped
# here by the release pipeline, so edit it upstream rather than in place — a direct edit is
# overwritten by the next sync.
#
# To run the same checks locally:
#   cargo fmt --all -- --check
#   cargo clippy --all-targets -- -D warnings
#   cargo test --all-targets
#   cargo build --release
#   bash scripts/check-crypto-provider.sh
#   bash scripts/acme-pebble-test.sh     # needs docker; see the acme-pebble job
#   bash scripts/redis-live-test.sh      # needs docker or EDGEGUARD_TEST_REDIS_URL
#   bash scripts/worker-check.sh         # needs node; builds worker/ and runs it on workerd
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      # ring must stay the ONLY linked crypto provider. A second one puts the aws-lc-sys C build
      # back on the critical path and makes `rustls::ClientConfig::builder()` panic in any crate
      # that resolves its provider from crate features (the `rediss://` limiter path). Neither
      # shows up as a test failure, and this crate ships without a lock of its own, so the cut
      # resolves fresh every time.
      - name: Crypto provider (no aws-lc in the graph)
        shell: bash
        run: bash scripts/check-crypto-provider.sh
      - name: Build (release)
        run: cargo build --release

  # ACME issuance AND renewal against Pebble, a real test CA. These tests are #[ignore]d in the
  # default suite because they need a CA, DNS pointing at this host and port 80; the script
  # provides all three and fails if a test skipped instead of running (a skip reports "ok").
  # Linux only: it runs Pebble under Docker, which the Windows runner cannot host.
  acme-pebble:
    name: acme (Pebble)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Issue and renew against Pebble
        run: bash scripts/acme-pebble-test.sh

  # The Redis-backed rate limiter and LLM budget against a live Redis. #[ignore]d in the default
  # suite; the script starts Redis under Docker and fails if a test skipped instead of running.
  redis-live:
    name: redis (live)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rate limiter and budget against Redis
        run: bash scripts/redis-live-test.sh

  # The Cloudflare Worker (worker/, a detached crate): build the deployable bundle with
  # worker-build and serve it on workerd, the runtime Cloudflare runs, checking auth, forwarding
  # and response hardening. Not a deploy: routes, domains and secret bindings need an account.
  worker:
    name: worker (workerd)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the bundle and run it on workerd
        run: bash scripts/worker-check.sh
