    keys: ["validation.allow_methods"]
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-060--only-the-methods-the-app-uses"
    why: |-
      `allow_methods` is empty by default (all methods). Scanners send `CONNECT`, `PROPFIND`,
      `TRACE`, `SSTP_DUPLEX_POST` (an SSL-VPN probe) and random four-letter verbs to find proxies, WebDAV
      and appliances behind you. Refusing them at the edge costs nothing.
    verify:
      - |-
        curl -sk -X PROPFIND -o /dev/null -w '%{http_code}\n' https://app.example.com/   # 405, outcome method_not_allowed
  - id: EG-HARD-061
    title: "Request bodies are capped at what the app accepts"
    layer: "Request validation"
    severity: Medium
    tags: []
    keys: ["validation.max_body"]
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-061--request-bodies-are-capped-at-what-the-app-accepts"
    why: |-
      The default `max_body` is 2 MiB. A cap at what the app really takes stops memory
      exhaustion through the edge and makes WAF body inspection cheaper. With `stream_requests` on, a
      body over the cap is cut after the upstream has seen its start.
    verify:
      - |-
        head -c 6000000 /dev/zero | curl -sk -X POST --data-binary @- -o /dev/null -w '%{http_code}\n' https://app.example.com/api/upload   # 413
  - id: EG-HARD-062
    title: "Request headers are capped"
    layer: "Request validation"
    severity: Medium
    tags: []
    keys: ["validation.max_header_bytes"]
    reference: [{file: "docs/security/examples/edgeguard.hardened.toml"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-062--request-headers-are-capped"
    why: |-
      `max_header_bytes` is `0` (off) by default, leaving only hyper's transport limit. Oversized
      headers are a cheap way to exhaust memory and to smuggle payloads past inspection limits.
    verify:
      - |-
        curl -sk -H "X-Pad: $(head -c 40000 /dev/zero | tr '\0' a)" -o /dev/null -w '%{http_code}\n' https://app.example.com/   # 431
  - id: EG-HARD-063
    title: "Slow clients are cut off"
    layer: "Request validation"
    severity: High
    tags: []
    keys: ["server.header_read_timeout"]
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-063--slow-clients-are-cut-off"
    why: |-
      `header_read_timeout` (30 s by default) runs before auth and rate limiting: without it a
      handful of clients sending a header a byte at a time hold sockets forever (slowloris). It also
      closes keep-alive connections idle that long. With PROXY protocol, the PROXY header and the first
      request head share the one deadline in 0.7.0. `"0"` disables it, and doctor warns.
    verify:
      - |-
        (printf 'GET / HTTP/1.1\r\nHost: app.example.com\r\n'; sleep 40) | openssl s_client -quiet -connect EDGE:443   # closed at ~30 s
  - id: EG-HARD-064
    title: "Connections are capped, and you see the cap approach"
    layer: "Request validation"
    severity: Medium
    tags: []
    keys: ["server.max_connections"]
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-064--connections-are-capped-and-you-see-the-cap-approach"
    why: |-
      `max_connections` is `0` (unlimited) by default. A cap keeps a connection flood from
      taking the process's memory and file descriptors; the admin listener has no cap, so health checks
      and scrapes still answer when the public port is full.
    verify:
      - |-
        curl -s "$ADMIN/__edgeguard/metrics" | grep -E '^edgeguard_connections_(open|max|rejected_total)'
  - id: EG-HARD-080
    title: "The WAF blocks, after a report-mode review"
    layer: "WAF"
    severity: High
    tags: []
    keys: ["waf.mode", "waf.sqli", "waf.xss", "waf.path_traversal", "waf.inspect_path", "waf.inspect_headers", "waf.inspect_body"]
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-080--the-waf-blocks-after-a-report-mode-review"
    why: |-
      `[waf] mode` is `off` by default. In report mode a match is logged and counted but the
      request is forwarded: in one deployment a `' OR '1'='1` probe was refused by an edge in block mode
      and reached the app through another left in report mode with header and body inspection off.
      Roll out in report mode, read the matches, then block. In a real review, 54 matches in 13 hours of
      report mode were all scanners, with no false positive from body inspection on an ingest API; the
      switch to block then cost nothing.
    verify:
      - |-
        curl -sk -o /dev/null -w '%{http_code}\n' "https://app.example.com/api/x?id=1%27%20OR%20%271%27=%271"   # 403
        # during the report phase: the "WAF hits by rule" query in LOGGING-AND-EVIDENCE.md; alert EdgeGuardWafBlockSpike
  - id: EG-HARD-081
    title: "Inspection covers the locations attacks use, and you know what streaming skips"
    layer: "WAF"
    severity: Medium
    tags: []
    keys: []
    reference: [{file: "docs/security/examples/edgeguard.hardened.toml"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-081--inspection-covers-the-locations-attacks-use-and-you-know-what-streaming-skips"
    why: |-
      `inspect_headers` and `inspect_body` are off by default; a custom rule on a location whose
      `inspect_*` flag is off never runs (and a misspelt flag is silently ignored: EG-HARD-240). A
      request body that streams (`stream_requests`) is not inspected unless its route is listed in
      `[[validation.stream_inspect]]`, and then only within a window. WebSocket frames are never
      inspected. The WAF matches the path raw and percent-decoded, which caught every path-mangling
      variant seen in the wild (`%2e%2e`, `..;/`, `%2f`, doubled slashes, changed case).
    verify:
      - |-
        curl -sk -H 'Referer: <script>alert(1)</script>' -o /dev/null -w '%{http_code}\n' https://app.example.com/   # 403 needs inspect_headers
  - id: EG-HARD-082
    title: "Every Host but yours is refused (the Host rule)"
    layer: "WAF"
    severity: High
    tags: [workaround-until-0.8]
    keys: []
    reference: [{file: "deploy/reference/tools/host-rule.sh"}, {setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-082--every-host-but-yours-is-refused-the-host-rule"
    why: |-
      0.7 has no allowed-hosts setting (0.8 plans `allowed_hosts`). Without one, eggrd serves
      any `Host`: raw-IP requests from scanners, forged names that poison password-reset links built
      from `Host` or `X-Forwarded-Host` (eggrd sets `X-Forwarded-Host` to the `Host` it received, which
      the client chose), and cache keys keyed on the host.
    verify:
      - |-
        curl -sk --http1.1 -o /dev/null -w '%{http_code}\n' -H 'Host: evil.example' https://EDGE/   # 403
        curl -sk --http2   -o /dev/null -w '%{http_code} %{http_version}\n' -H 'Host: evil.example' https://EDGE/   # 403 1.1
        curl -sk -o /dev/null -w '%{http_code}\n' https://EDGE_IP/                                   # 403
        curl -s --http2-prior-knowledge -o /dev/null -w '%{http_code}\n' -H 'Host: evil.example' http://EDGE:8080/   # the plain proxy listener (server.port, [tls] off): 200 on 0.7.0, 403 on 0.7.1
  - id: EG-HARD-083
    title: "Paths that are never valid are refused at the edge"
    layer: "WAF"
    severity: Medium
    tags: []
    keys: ["waf.rules.id", "waf.rules.target", "waf.rules.pattern"]
    reference: [{file: "docs/security/examples/edgeguard.hardened.toml"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-083--paths-that-are-never-valid-are-refused-at-the-edge"
    why: |-
      Probes for `/.env`, `/.git/config`, `/.aws/credentials`, `phpinfo`, WordPress, SAP, VPN
      appliances and `cgi-bin` made up most of the attack traffic in the logs reviewed, and one in seven
      `.env` probes was answered `200` by the app's catch-all route. Refusing them at the edge keeps
      them out of the app, makes the probe obvious in the log (`forbidden`, with the rule id), and
      answers scanners with a 403 rather than a page their tooling flags as a hit. It does not replace
      EG-HARD-146. Add rules for exploits specific to your stack, for example a header an
      authentication-bypass CVE relies on.
    verify:
      - |-
        for p in /.env //.env /./.env /.ENV /%2eenv /app/.env /blog/.git/config //WP-LOGIN.PHP; do
          curl -sk --path-as-is -o /dev/null -w "$p %{http_code}\n" "https://app.example.com$p"   # 403 each
        done
        curl -sk -o /dev/null -w '%{http_code}\n' -H 'x-middleware-subrequest: x' https://app.example.com/admin  # 403
  - id: EG-HARD-100
    title: "Anything not meant to be public has a gate"
    layer: "Authentication"
    severity: High
    tags: [app]
    keys: []
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-100--anything-not-meant-to-be-public-has-a-gate"
    why: |-
      `auth.mode = "none"` (the default) forwards every request unauthenticated; doctor warns.
      That is right only when the app authenticates every route itself, and checking that is the app
      team's job: probe `/api/*` without a session. The gate is per deployment, not per route: in 0.7
      there is no per-path auth.
    verify:
      - |-
        curl -sk -o /dev/null -w '%{http_code}\n' https://app.example.com/api/private   # 401 from the edge, or from the app
  - id: EG-HARD-101
    title: "A credential header sent twice is refused (0.7.0), and the app reads the same one"
    layer: "Authentication"
    severity: High
    tags: [app]
    keys: []
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-101--a-credential-header-sent-twice-is-refused-070-and-the-app-reads-the-same-one"
    why: |-
      Before 0.7.0 the edge checked the first `Authorization`/API-key header and forwarded the
      last, so a valid key first and a forged token second passed the edge and reached the app as the
      forged one. 0.7.0 answers `401` when the header it authenticates by appears more than once
      (`basic`, `jwt`, `apikey`); `none` and `mtls` forward duplicates for the app to judge. An app that
      reads a *different* credential than the edge checked (a query parameter, a second header, a
      cookie) reopens the hole.
    verify:
      - |-
        curl -sk -H 'X-API-Key: valid' -H 'X-API-Key: forged' -o /dev/null -w '%{http_code}\n' https://app.example.com/api/x   # 401
  - id: EG-HARD-102
    title: "Basic passwords are argon2 hashes"
    layer: "Authentication"
    severity: High
    tags: []
    keys: ["auth.mode", "auth.users"]
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-102--basic-passwords-are-argon2-hashes"
    why: |-
      A plaintext `auth.users` value is a dev convenience; the config file is copied into
      backups, tickets and evidence bundles. doctor warns on plaintext and on a value that is not a valid
      argon2 PHC string.
    verify:
      - |-
        edgeguard doctor --config edgeguard.toml   # no "plaintext password" warning
  - id: EG-HARD-103
    title: "JWTs are pinned to one algorithm, issuer and audience"
    layer: "Authentication"
    severity: High
    tags: []
    keys: ["auth.mode", "auth.jwt.algorithm", "auth.jwt.jwks_url", "auth.jwt.issuer", "auth.jwt.audience", "auth.jwt.leeway_secs"]
    reference: [{setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-103--jwts-are-pinned-to-one-algorithm-issuer-and-audience"
    why: |-
      eggrd never lets the token choose its algorithm (`alg` must equal `auth.jwt.algorithm`),
      which closes `alg=none` and RS/HS confusion. `issuer` and `audience` are optional: without them, a
      token your IdP minted for another application is accepted here.
    verify:
      - |-
        curl -sk -H "Authorization: Bearer $TOKEN_FOR_ANOTHER_AUDIENCE" -o /dev/null -w '%{http_code}\n' https://app.example.com/api/x   # 401
  - id: EG-HARD-104
    title: "API keys are random, many, and named in logs only by hash"
    layer: "Authentication"
    severity: Medium
    tags: []
    keys: []
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-104--api-keys-are-random-many-and-named-in-logs-only-by-hash"
    why: |-
      Keys are compared in constant time and logged as `apikey:<16 hex>` (a hash prefix, never
      the key), so a leak investigation can follow one key across the log without anyone holding it. One
      key per client is what makes revoking one leaked key possible without an outage for all. The id is
      Rust's default 64-bit hasher over the key. Measured: identical for the same key on 0.7.0-rc.1,
      0.7.0 and a rebuild of main with rustc 1.99.1; 0.5 and earlier log no principal. The standard
      library does not promise that hasher is stable across Rust versions, so after an upgrade, confirm
      with one known test key that ids still match before joining logs across the upgrade.
    verify: []
  - id: EG-HARD-105
    title: "Paths that need a stronger gate than the rest are split out"
    layer: "Authentication"
    severity: Medium
    tags: [gap]
    keys: ["waf.rules.id", "waf.rules.target", "waf.rules.pattern"]
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-105--paths-that-need-a-stronger-gate-than-the-rest-are-split-out"
    why: |-
      `auth.mode` applies to every proxied request; 0.7 cannot require a key or a client
      certificate on `/admin` only. Measured on 0.7.0: switching the mode to `apikey` turned `/` into a
      401 as well as `/api/`.
    verify:
      - |-
        for p in /admin //admin /ADMIN /./admin '/admin;x' /%61dmin; do
          curl -sk --path-as-is -o /dev/null -w "$p %{http_code}\n" "https://app.example.com$p"   # 403 each, or 401
        done
  - id: EG-HARD-120
    title: "A global per-IP limit is on"
    layer: "Rate limiting"
    severity: High
    tags: []
    keys: ["ratelimit.enabled", "ratelimit.rate", "ratelimit.burst"]
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-120--a-global-per-ip-limit-is-on"
    why: |-
      Rate limiting is on by default at 60/min, burst 20. In the logs reviewed, a third of all
      requests were answered `429`, almost all to scanners, and clients sent thirteen thousand requests
      after their first 429: scanners do not back off. The limit does not stop them sending; it stops
      them reaching the app. Limits key on the resolved client address, so EG-HARD-040/041/044 must be
      right first.
    verify:
      - |-
        for i in $(seq 1 60); do curl -sk -o /dev/null -w '%{http_code} ' https://app.example.com/; done   # 429s after the burst
        # PromQL  sum by (scope) (rate(edgeguard_ratelimit_hits_total[5m])); alert EdgeGuardRateLimitSaturation
  - id: EG-HARD-121
    title: "Credential endpoints have a strict route limit"
    layer: "Rate limiting"
    severity: High
    tags: [app]
    keys: ["ratelimit.routes.path", "ratelimit.routes.rate", "ratelimit.routes.burst", "ratelimit.routes.name"]
    reference: [{setup: "compose-single-vm"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-121--credential-endpoints-have-a-strict-route-limit"
    why: |-
      Login, token, password-reset and sign-up endpoints are where credential stuffing and
      enumeration land. A route limit is still per IP, so it slows a single source; a distributed
      stuffing run needs the app's own per-account lockout and breached-password checks too.
    verify:
      - |-
        # PromQL  rate(edgeguard_ratelimit_hits_total{scope="route"}[5m]); edgeguard_route_requests_total{route="login"}
  - id: EG-HARD-122
    title: "Authenticated clients have a per-principal limit"
    layer: "Rate limiting"
    severity: Medium
    tags: []
    keys: ["ratelimit.per_key.enabled", "ratelimit.per_key.rate", "ratelimit.per_key.burst"]
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-122--authenticated-clients-have-a-per-principal-limit"
    why: |-
      One API key spread over many addresses gets a per-IP bucket on each. A per-key limit
      bounds what a leaked key can do before you revoke it.
    verify:
      - |-
        # PromQL  rate(edgeguard_ratelimit_hits_total{scope="key"}[5m])
  - id: EG-HARD-123
    title: "Several replicas share one limit, and a store outage fails closed"
    layer: "Rate limiting"
    severity: Medium
    tags: []
    keys: ["ratelimit.store", "ratelimit.redis_prefix", "ratelimit.fail_open"]
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-123--several-replicas-share-one-limit-and-a-store-outage-fails-closed"
    why: |-
      `store = "local"` is per process: N replicas allow N times the limit. With `store =
      "redis"`, `fail_open = false` (the default) answers `503` when Redis is unreachable rather than
      silently dropping rate limiting.
    verify:
      - |-
        # PromQL  sum(rate(edgeguard_requests_total{outcome="limiter_error"}[5m]))   0
  - id: EG-HARD-124
    title: "Distributed and repeat scanners are handled beyond the per-IP limit"
    layer: "Rate limiting"
    severity: Medium
    tags: [gap]
    keys: []
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-124--distributed-and-repeat-scanners-are-handled-beyond-the-per-ip-limit"
    why: |-
      In six weeks of one deployment's log, 192 probing addresses sent three requests or fewer
      each: no per-IP limit ever sees them. Repeat offenders keep coming back after their 429s. 0.7 has
      no automatic ban or jail.
    verify:
      - |-
        # the "hit-and-run probers" and "requests after the first 429" queries in LOGGING-AND-EVIDENCE.md
  - id: EG-HARD-140
    title: "The CSP is enforced, after a report-only phase"
    layer: "Response headers"
    severity: High
    tags: [app]
    keys: ["headers.csp", "headers.csp_report_only", "headers.csp_report_uri"]
    reference: [{setup: "compose-single-vm"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-140--the-csp-is-enforced-after-a-report-only-phase"
    why: |-
      The default CSP (`default-src 'self'`) blocks inline scripts, which breaks frameworks that
      hydrate with inline scripts. The common response is `csp_report_only = true` forever, which
      protects nothing. Roll out with reports, then enforce. A policy without `'unsafe-inline'` in
      `script-src` needs a per-request nonce, which only the app can mint.
    verify:
      - |-
        curl -sk -D - -o /dev/null https://app.example.com/ | grep -i '^content-security-policy'   # not -report-only
  - id: EG-HARD-141
    title: "HSTS is on"
    layer: "Response headers"
    severity: Medium
    tags: []
    keys: ["headers.hsts"]
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-141--hsts-is-on"
    why: |-
      `hsts = true` (the default) sends `max-age=63072000; includeSubDomains`; the value is fixed
      in 0.7 (no `preload` token). Once browsers have seen it they refuse plaintext for two years, so turn
      it on only when every subdomain is HTTPS.
    verify:
      - |-
        curl -sk -D - -o /dev/null https://app.example.com/ | grep -i strict-transport-security
  - id: EG-HARD-142
    title: "Framing, referrer and feature headers stay at their defaults"
    layer: "Response headers"
    severity: Low
    tags: []
    keys: ["headers.frame_options", "headers.referrer_policy", "headers.permissions_policy"]
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-142--framing-referrer-and-feature-headers-stay-at-their-defaults"
    why: |-
      The defaults are `X-Frame-Options: DENY`, `Referrer-Policy: no-referrer`,
      `Permissions-Policy: geolocation=(), microphone=(), camera=()` and `X-Content-Type-Options:
      nosniff` (always). Loosening them is a decision to record, not a default to drift into.
    verify:
      - |-
        curl -sk -D - -o /dev/null https://app.example.com/ | grep -iE '^(x-frame-options|referrer-policy|permissions-policy|x-content-type-options)'
  - id: EG-HARD-143
    title: "Server banners are removed"
    layer: "Response headers"
    severity: Low
    tags: []
    keys: ["headers.strip"]
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-143--server-banners-are-removed"
    why: |-
      `Server` and `X-Powered-By` tell a scanner which exploit to try. `strip` removes them by
      default (measured: the upstream's `Server` header did not reach the client).
    verify:
      - |-
        curl -sk -D - -o /dev/null https://app.example.com/ | grep -iE '^(server|x-powered-by):'   # nothing
  - id: EG-HARD-144
    title: "Cookies are Secure and HttpOnly unless one is named as an exception"
    layer: "Response headers"
    severity: Medium
    tags: []
    keys: ["headers.force_secure_cookies", "headers.httponly_cookies", "headers.httponly_cookie_exempt"]
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-144--cookies-are-secure-and-httponly-unless-one-is-named-as-an-exception"
    why: |-
      `force_secure_cookies` and `httponly_cookies` (both on by default) add `Secure`,
      `HttpOnly` and `SameSite=Lax` to `Set-Cookie` values that lack them. A double-submit CSRF cookie
      the frontend must read is the one legitimate exception: exempt it by exact name, never by turning
      `httponly_cookies` off.
    verify:
      - |-
        curl -sk -D - -o /dev/null https://app.example.com/login | grep -i '^set-cookie'
  - id: EG-HARD-145
    title: "CORS is off, or lists exact origins"
    layer: "Response headers"
    severity: Medium
    tags: []
    keys: ["cors.enabled", "cors.allow_origins", "cors.allow_credentials", "cors.max_age"]
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-145--cors-is-off-or-lists-exact-origins"
    why: |-
      `[cors]` is off by default. `allow_origins = ["*"]` lets any site read responses with the
      user's network position; with `allow_credentials` it is refused at load.
    verify:
      - |-
        curl -sk -H 'Origin: https://evil.example' -D - -o /dev/null https://app.example.com/api/x | grep -i access-control-allow-origin   # absent
  - id: EG-HARD-146
    title: "The app answers unknown paths with 404"
    layer: "Response headers"
    severity: Medium
    tags: [app]
    keys: []
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-146--the-app-answers-unknown-paths-with-404"
    why: |-
      A single-page app's catch-all route answers every unknown path `200` with its HTML shell.
      In the logs reviewed, about one in seven `/.env` probes, and hundreds of PHP and config-file
      probes, got a `200`: no secret leaked, but every scanner records the site as "has `.env`", and
      your own log can no longer tell a hit from a miss. The edge cannot know which paths your app
      serves.
    verify:
      - |-
        curl -sk -o /dev/null -w '%{http_code}\n' https://app.example.com/this-does-not-exist.php   # 404 (or 403 from the edge rule)
  - id: EG-HARD-160
    title: "Upstreams across an untrusted network are reached over TLS, with a client certificate"
    layer: "Upstream"
    severity: High
    tags: []
    keys: ["upstream_tls.ca_path", "upstream_tls.cert_path", "upstream_tls.key_path"]
    reference: [{setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-160--upstreams-across-an-untrusted-network-are-reached-over-tls-with-a-client-certificate"
    why: |-
      The edge-to-app hop carries every credential and session the edge saw. Inside one host or
      one cluster network that may be acceptable; across a VPN, a peering link or the internet it is not.
      A wrong-CA upstream certificate fails with `502` (`UnknownIssuer`).
    verify:
      - |-
        curl -s "$ADMIN/__edgeguard/upstreams"   # targets by scheme://host:port, ok counts rising
        # PromQL  rate(edgeguard_upstream_requests_total{result="tls_error"}[5m])   0
  - id: EG-HARD-161
    title: "The app trusts the edge's client headers only, and validates Host itself"
    layer: "Upstream"
    severity: High
    tags: [app]
    keys: []
    reference: [{setup: "aws-alb"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-161--the-app-trusts-the-edges-client-headers-only-and-validates-host-itself"
    why: |-
      0.7.0 replaces `X-Forwarded-For`, `X-Real-IP` and `Forwarded` with the resolved client,
      sets `X-Forwarded-Host` to the `Host` it received, and removes `True-Client-IP` (measured: spoofed
      values of all five never reached the app). Two things remain the app's: accept these headers only
      from the edge (the app's port reachable from the edge only, EG-HARD-005), and validate `Host`
      before building links from it, since the client still chooses `Host` and eggrd 0.7 has no
      allowed-hosts list (the Host rule, EG-HARD-082, is the interim edge control).
    verify: []
  - id: EG-HARD-162
    title: "Upstream timeouts are bounded"
    layer: "Upstream"
    severity: Medium
    tags: []
    keys: ["validation.upstream_timeout", "validation.upstream_connect_timeout"]
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-162--upstream-timeouts-are-bounded"
    why: |-
      `upstream_connect_timeout` (5 s, new in 0.7) and `upstream_timeout` (30 s) bound how long
      a stalled or blackholed upstream holds a request and a connection; without them a slow upstream
      becomes an edge-wide resource exhaustion.
    verify:
      - |-
        # PromQL  sum(rate(edgeguard_requests_total{outcome="upstream_timeout"}[5m]))
  - id: EG-HARD-163
    title: "Pools are health-checked and eject failing targets"
    layer: "Upstream"
    severity: Medium
    tags: []
    keys: ["upstreams.path", "upstreams.targets", "upstreams.eject_after", "upstreams.eject_for", "upstreams.health_check"]
    reference: [{setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-163--pools-are-health-checked-and-eject-failing-targets"
    why: |-
      A compromised or broken target keeps receiving traffic until something takes it out.
      doctor warns on a pool with neither a health check nor `eject_after`.
    verify:
      - |-
        curl -s "$ADMIN/__edgeguard/upstreams"    # in_rotation, ejected, health_check.passing per target
  - id: EG-HARD-164
    title: "Buffered responses are capped"
    layer: "Upstream"
    severity: Low
    tags: []
    keys: ["validation.max_response_body"]
    reference: [{file: "docs/security/examples/edgeguard.hardened.toml"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-164--buffered-responses-are-capped"
    why: |-
      `max_response_body` is `0` (unbounded) by default: a misbehaving or compromised upstream
      can make the edge buffer an arbitrarily large body.
    verify:
      - |-
        # PromQL  rate(edgeguard_requests_total{outcome="upstream_body_too_large"}[1h])
  - id: EG-HARD-165
    title: "No credentials in upstream URLs"
    layer: "Upstream"
    severity: Medium
    tags: []
    keys: []
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-165--no-credentials-in-upstream-urls"
    why: |-
      The access record strips userinfo from the upstream (`scheme://host:port`), but in 0.7.0
      the `upstream unreachable` and `upstream timed out` WARN lines print the configured base URL whole:
      measured, `http://svc-user:<password>@host` appeared in the log. Fixed in 0.7.1 (#1748), which redacts
      userinfo everywhere a URL is logged; on 0.7.0, and as a rule, keep credentials out of URLs. Logs are
      the most-copied artefact you have.
    verify:
      - |-
        grep -nE '://[^/@" ]+:[^/@" ]+@' edgeguard.toml   # nothing
  - id: EG-HARD-180
    title: "The ACME account and the TLS key are readable by the edge only"
    layer: "Secrets and files"
    severity: High
    tags: [workaround-until-0.8]
    keys: []
    reference: [{setup: "compose-single-vm"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-180--the-acme-account-and-the-tls-key-are-readable-by-the-edge-only"
    why: |-
      0.7 writes `acme/account.json` (it holds the ACME account's private key) and the
      issuance ledger `0644`. With the account key, anyone on the host can revoke your certificates or
      order new ones for your names. 0.8 plans to write them `0600`.
    verify:
      - |-
        ls -la /var/lib/edgeguard /var/lib/edgeguard/acme   # no group or world bits on key.pem and *.json
  - id: EG-HARD-181
    title: "Secrets come from the environment or a mounted file, not the config"
    layer: "Secrets and files"
    severity: High
    tags: []
    keys: []
    reference: [{file: "examples"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-181--secrets-come-from-the-environment-or-a-mounted-file-not-the-config"
    why: |-
      The config file goes into version control, ConfigMaps (readable by anyone with `get` on
      the namespace), backups and evidence bundles. doctor warns when `auth.jwt.secret`, `auth.api_keys`
      or `control_plane.edge_token` are in the file.
    verify:
      - |-
        edgeguard doctor --config edgeguard.toml   # no "prefer the … env var" warnings
  - id: EG-HARD-182
    title: "The ACME contact is a role address"
    layer: "Secrets and files"
    severity: Low
    tags: []
    keys: ["tls.acme.email"]
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-182--the-acme-contact-is-a-role-address"
    why: |-
      The CA sends expiry and revocation notices there; a personal mailbox leaves with its
      owner.
    verify: []
  - id: EG-HARD-183
    title: "Nothing sensitive is left beside the config"
    layer: "Secrets and files"
    severity: Medium
    tags: []
    keys: []
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-183--nothing-sensitive-is-left-beside-the-config"
    why: |-
      Hosts collect `edgeguard.toml.bak-*`, configs of the proxy eggrd replaced, old `.env`
      copies and expired key backups. They outlive the rotation of what they hold.
    verify:
      - |-
        ls -la /etc/edgeguard /var/lib/edgeguard    # the config, cert.pem, key.pem, acme/ and nothing else
  - id: EG-HARD-184
    title: "Backups and evidence of the state volume are handled as secrets"
    layer: "Secrets and files"
    severity: Medium
    tags: []
    keys: []
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-184--backups-and-evidence-of-the-state-volume-are-handled-as-secrets"
    why: |-
      A tarball of `/var/lib/edgeguard` is the TLS key and the ACME account key. So is the
      evidence bundle of INCIDENT-RESPONSE.md.
    verify: []
  - id: EG-HARD-200
    title: "Runs as a non-root user"
    layer: "Container and pod runtime"
    severity: High
    tags: []
    keys: []
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-200--runs-as-a-non-root-user"
    why: |-
      The image is distroless and runs as 65532 by default; an explicit `--user` (or
      `runAsUser`, `runAsNonRoot`) keeps an override from silently making it root.
    verify:
      - |-
        docker inspect --format '{{.Config.User}}' eggrd    # 65532:65532
  - id: EG-HARD-201
    title: "Read-only root filesystem"
    layer: "Container and pod runtime"
    severity: High
    tags: []
    keys: []
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-201--read-only-root-filesystem"
    why: |-
      An attacker with code execution cannot drop a binary or alter the image's files. eggrd
      writes only its state directory (certificate, key, ACME) and `/tmp`.
    verify:
      - |-
        docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' eggrd   # true
  - id: EG-HARD-202
    title: "All capabilities dropped but the one to bind low ports"
    layer: "Container and pod runtime"
    severity: High
    tags: []
    keys: []
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-202--all-capabilities-dropped-but-the-one-to-bind-low-ports"
    why: |-
      The default capability set includes `NET_RAW`, `CHOWN`, `SETUID` and others an edge never
      needs. `NET_BIND_SERVICE` is needed only to bind 80/443 as a non-root user.
    verify:
      - |-
        docker inspect --format '{{.HostConfig.CapDrop}} {{.HostConfig.CapAdd}}' eggrd   # [ALL] [NET_BIND_SERVICE]
  - id: EG-HARD-203
    title: "No privilege escalation, default seccomp"
    layer: "Container and pod runtime"
    severity: High
    tags: []
    keys: []
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-203--no-privilege-escalation-default-seccomp"
    why: |-
      A setuid binary or a file capability cannot raise an attacker's privileges in a process
      that may not gain any, and the runtime's default seccomp profile removes the system calls
      (`mount`, `ptrace`, kernel keyrings, `unshare`…) most container escapes start with. eggrd needs
      none of them.
    verify:
      - |-
        docker inspect --format '{{.HostConfig.SecurityOpt}}' eggrd   # [no-new-privileges]
  - id: EG-HARD-204
    title: "Memory, CPU and process limits"
    layer: "Container and pod runtime"
    severity: Medium
    tags: []
    keys: []
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-204--memory-cpu-and-process-limits"
    why: |-
      A flood or a bug should cost the edge its own container, not the host it shares with the
      app.
    verify:
      - |-
        docker inspect --format '{{.HostConfig.Memory}} {{.HostConfig.NanoCpus}} {{.HostConfig.PidsLimit}}' eggrd
  - id: EG-HARD-205
    title: "The edge comes back by itself, and something outside checks it"
    layer: "Container and pod runtime"
    severity: Medium
    tags: []
    keys: []
    reference: [{setup: "compose-single-vm"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-205--the-edge-comes-back-by-itself-and-something-outside-checks-it"
    why: |-
      `docker run` without a restart policy stays down after a crash or a reboot. The image has
      no shell, so it cannot carry a `HEALTHCHECK`: probe `/__edgeguard/ready` from outside (kubelet,
      a sidecar, a host check). Measured on 0.7.0: a container restart refused connections for 0.4 s.
    verify:
      - |-
        docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' eggrd    # unless-stopped
        # On a staging edge, never production (it takes the edge down): restart the daemon, as a reboot
        # would, and the edge must come back. (`docker stop` would not test this: unless-stopped then
        # deliberately stays down; a crash or a daemon restart is what the policy is for.)
        sudo systemctl restart docker; sleep 10; docker ps --filter name=eggrd   # Up
  - id: EG-HARD-206
    title: "Kubernetes: Pod Security `restricted`, no service-account token"
    layer: "Container and pod runtime"
    severity: High
    tags: []
    keys: []
    reference: [{setup: "kubernetes"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-206--kubernetes-pod-security-restricted-no-service-account-token"
    why: |-
      `restricted` enforces most of 200–203 at admission. The edge needs no Kubernetes API, so
      a mounted token is only something to steal. A `hostPort` edge needs `privileged` in its own
      namespace; keep every other namespace `restricted`.
    verify:
      - |-
        kubectl label --dry-run=server --overwrite ns eggrd-app pod-security.kubernetes.io/enforce=restricted   # no violations
  - id: EG-HARD-220
    title: "The image is pinned by its multi-arch index digest"
    layer: "Supply chain"
    severity: High
    tags: []
    keys: []
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-220--the-image-is-pinned-by-its-multi-arch-index-digest"
    why: |-
      A tag is a pointer that can move. After three releases an amd64-only image overwrote the
      `X.Y.Z` tag about 22 minutes after the release (0.7.0 was re-pointed; the release now asserts and
      watches its tags). A digest is what you tested.
    verify:
      - |-
        docker buildx imagetools inspect docker.io/mancube/eggrd:0.7.0   # an OCI index with linux/amd64 and linux/arm64
        docker inspect --format '{{.Image}}' eggrd                       # the running image
  - id: EG-HARD-221
    title: "You check what the release publishes, and generate what it does not"
    layer: "Supply chain"
    severity: Medium
    tags: [gap]
    keys: []
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-221--you-check-what-the-release-publishes-and-generate-what-it-does-not"
    why: |-
      0.7.0 publishes the image (by digest, two architectures) and the crate on crates.io. The
      image build turns provenance and SBOM attestations off, and there is no image signature yet.
    verify: []
  - id: EG-HARD-222
    title: "Dependencies are re-checked between releases"
    layer: "Supply chain"
    severity: Low
    tags: []
    keys: []
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-222--dependencies-are-re-checked-between-releases"
    why: |-
      A vulnerability in a dependency (rustls, hyper, tokio) is fixed by a new eggrd release,
      not by your rebuild of the old one.
    verify: []
  - id: EG-HARD-240
    title: "`doctor` runs in CI with 0 errors, and keys are checked against the reference"
    layer: "Operations"
    severity: High
    tags: [workaround-until-0.8]
    keys: []
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-240--doctor-runs-in-ci-with-0-errors-and-keys-are-checked-against-the-reference"
    why: |-
      `edgeguard doctor` catches bad values, missing files, risky combinations and secrets in
      the file. It does **not** see unknown keys: a misspelt key (`inspect_header`), a key from another
      version, or a key that does not exist (`allowed_hosts`, `[log] level`) loads silently and does
      nothing. Measured: with `inspect_headers` misspelt, the Host rule stopped matching and a forged
      Host got `200`, with doctor clean. 0.8 plans a warning.
    verify: []
  - id: EG-HARD-241
    title: "You run a release with the current security fixes"
    layer: "Operations"
    severity: Critical
    tags: []
    keys: []
    reference: [{file: "CHANGELOG.md"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-241--you-run-a-release-with-the-current-security-fixes"
    why: |-
      0.7.0 fixed three security bugs: a duplicated credential header passing the edge with one
      value and reaching the app with another; `trust_forwarded_for` taking the client-written
      `X-Forwarded-For` entry; and client-written `X-Real-IP`, `True-Client-IP`, `Forwarded`,
      `X-Forwarded-Host` reaching the app. Affected: every release up to and including 0.5.0 has all
      three (0.6.0 was never released; only a `0.6.0-beta.1` was cut), and the published 0.7.0-rc.1 has
      all three as well; 0.7.0 is the first fixed release. On 0.7.0 itself, the WAF Host rule
      bypasses of EG-HARD-082 and the upstream-credential logging of EG-HARD-165 are fixed in 0.7.1 (#1748):
      run 0.7.1.
    verify:
      - |-
        docker run --rm "docker.io/mancube/eggrd:0.7.1@$DIGEST_FROM_THE_0_7_1_RELEASE_NOTES" --version   # edgeguard 0.7.1
        docker inspect --format '{{.Image}}' eggrd    # the running edge: compare with the digest you pinned
  - id: EG-HARD-242
    title: "Config changes reach the running edge the way you think they do"
    layer: "Operations"
    severity: Medium
    tags: [workaround-until-0.8]
    keys: []
    reference: [{setup: "compose-single-vm"}, {setup: "kubernetes"}, {setup: "aws-nlb"}, {setup: "aws-alb"}, {setup: "hybrid-pools"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-242--config-changes-reach-the-running-edge-the-way-you-think-they-do"
    why: |-
      eggrd watches the config file's directory (not recursively) and reloads on a change it
      attributes to the config file. A bind mount of the directory delivers that; a single-file bind mount
      does not. On a ConfigMap volume the kubelet updates the files by writing a new timestamped
      directory and renaming a `..data_tmp` symlink over `..data` (recorded with inotify on k3s v1.31.14:
      `CREATE ..<timestamp>`, `CREATE ..data_tmp`, `MOVED_FROM ..data_tmp`, `MOVED_TO ..data`,
      `DELETE` of the old directory; no event names `edgeguard.toml`), and eggrd 0.7.0 did reload after
      that swap. Which event it matches is not yet pinned down in `src/reload.rs`, so treat the ConfigMap
      result as an observation of these versions, not a guarantee. What delivered a reload, on 0.7.0:

      | Delivery | Reloads? |
      |---|---|
      | Directory bind mount, any edit | Yes, in 0.2–0.35 s |
      | Single-file bind mount | No (and an editor that replaces the file leaves the container on the old inode) |
      | Host folder bind-mounted into Docker Desktop's or Podman's VM (Windows, macOS) | No |
      | `subPath` mount of a ConfigMap | No (never updated) |
      | ConfigMap volume, in-place edit | k3s v1.31.14 (containerd): yes, 27–62 s after the edit (the kubelet's sync), four times out of four. k3s v1.33.4 with the Docker runtime (a build of 2026-10-27): no reload within 90 s, one run. Untested elsewhere. Do not depend on it |
      | Kubernetes, new ConfigMap name + pod roll | Yes: the roll is the reload (13–14 s for a one-replica `Recreate` hostPort edge, about 2 s of it refusing) |

      The single-file and VM-folder rows come from the reference deployments' tests; the others were
      measured for this corpus. A reload that does not parse keeps the previous config and logs `config reload failed; keeping
      previous config` (ERROR). Listener settings (`port`, `admin_*`, `header_read_timeout`,
      `max_connections`, `drain_*`, `proxy_protocol*`, `upstream_connect_timeout`, all of `[tls]`,
      `[log.ship]`, `[tracing]`) need a restart whatever the delivery.
    verify:
      - |-
        docker logs --since 1m eggrd 2>&1 | grep -E 'config reload'
  - id: EG-HARD-243
    title: "Logs leave the host as they are written, and are kept"
    layer: "Operations"
    severity: High
    tags: []
    keys: []
    reference: [{setup: "compose-single-vm"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-243--logs-leave-the-host-as-they-are-written-and-are-kept"
    why: |-
      A container's log lives as long as the container (on Kubernetes, the current and the
      previous one). An incident found a week later, or an attacker with the host, leaves nothing to
      investigate. Retention, integrity and queries are in
      [LOGGING-AND-EVIDENCE.md](LOGGING-AND-EVIDENCE.md).
    verify: []
  - id: EG-HARD-244
    title: "The monitoring bundle's alerts are deployed and routed"
    layer: "Operations"
    severity: High
    tags: []
    keys: []
    reference: [{setup: "monitoring"}, {file: "monitoring"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-244--the-monitoring-bundles-alerts-are-deployed-and-routed"
    why: |-
      The alerts are how most of INCIDENT-RESPONSE.md's detection signals reach a person.
    verify:
      - |-
        promtool test rules monitoring/prometheus/alerts.test.yml
  - id: EG-HARD-245
    title: "The clock is synchronised"
    layer: "Operations"
    severity: Medium
    tags: []
    keys: []
    reference: []
    anchor: "HARDENING-CHECKLIST.md#eg-hard-245--the-clock-is-synchronised"
    why: |-
      Every timeline in an investigation is built from timestamps on several machines (the
      balancer, eggrd, the app, the database). Certificate validity depends on it too.
    verify:
      - |-
        chronyc tracking    # or: timedatectl show-timesync --all
  - id: EG-HARD-246
    title: "Principals are logged in a way your privacy rules allow"
    layer: "Operations"
    severity: Low
    tags: []
    keys: ["log.principal", "log.query", "metrics.consumer_series_max"]
    reference: [{setup: "compose-single-vm"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-246--principals-are-logged-in-a-way-your-privacy-rules-allow"
    why: |-
      `principal` is the API-key id, Basic user, JWT `sub` or certificate name, recorded whole
      by default. If those are e-mail addresses, the access log is personal data. `hash` keeps lines from
      one caller correlatable (`sha256:<16 hex>`) without the name; it is pseudonymous, not anonymous.
      Per-consumer metric series carry the same names: `metrics.consumer_series_max = 0` turns them off.
    verify: []
  - id: EG-HARD-247
    title: "The containment levers are rehearsed"
    layer: "Operations"
    severity: Medium
    tags: []
    keys: []
    reference: [{file: "docs/security/INCIDENT-RESPONSE.md"}]
    anchor: "HARDENING-CHECKLIST.md#eg-hard-247--the-containment-levers-are-rehearsed"
    why: |-
      During an incident is the wrong time to find out that your config is a single-file mount
      and nothing reloads, or that removing a route sends its traffic to the default upstream instead of
      taking it offline.
    verify: []
