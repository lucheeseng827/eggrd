# Two namespaces: the edge's and the app's. Both enforce Pod Security `restricted`. The hostPort
# overlay relaxes only the edge's to `privileged` (hostPort is refused by `baseline` and
# `restricted`), keeping `warn`/`audit` at `restricted` so anything else in it still shows up.
apiVersion: v1
kind: Namespace
metadata:
  name: eggrd-edge
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: eggrd-app
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
