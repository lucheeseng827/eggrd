# A local stand-in for the NLB, for smoke.sh: TCP passthrough with PROXY protocol v2 to the edge,
# and an HTTP health check of /__edgeguard/ready on the edge's admin port that carries a PROXY v2
# header too (check-send-proxy), as the NLB's does. Not an NLB: no cross-zone, no deregistration
# delay, no client IP preservation switch. It proves eggrd's side of the contract.
global
  log stdout format raw local0 info

defaults
  mode tcp
  log global
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend https
  bind :8443
  default_backend edge_https

frontend http
  bind :8080
  default_backend edge_http

backend edge_https
  option httpchk GET /__edgeguard/ready
  http-check expect status 200
  server edge edge:443 send-proxy-v2 check port 9090 check-send-proxy inter 2s fall 2 rise 2

backend edge_http
  server edge edge:80 send-proxy-v2

listen stats
  mode http
  bind :8404
  stats enable
  stats uri /stats
